<script type="text/plain" id="f-design"># Green Control · DESIGN.md

The design system behind AI GC · Green Control, an AI that watches a building's energy systems with the people who run them.
Written for designers, engineers and AI agents. Tokens live in `tokens.json` (W3C DTCG format). Version 1.8.

## The one idea

**Evidence first. People decide.**
The AI may look, compare and suggest. Anything that changes a machine waits for a person, shows why, and can be undone.

## Where the rules come from

Every rule below comes from one or more of three places, tagged in brackets:

- **[Industry]** what operators already expect from control-room screens. Green Control follows ISA-101 (high-performance HMI: grey by default, colour only for the abnormal, values shown against their normal range), ISA-18.2 (alarm management: every alarm asks for a defined response, no alarm floods) and WCAG (contrast, focus).
- **[Product]** what Green Control cares about most: evidence first, people decide.
- **[Task]** what the person on shift is doing at that moment: detect, diagnose, respond or review (see "What the person is doing").

Where Green Control deliberately differs from the industry habit, the rule says so and why. A difference that is not written down gets lost: the next screen, or the next agent, falls back to the default.

## Look

Every rule says why. If a case seems to need an exception, read the reason first: it tells you whether the case is really different, or only looks different.

- **Two themes, one set of names.** Night (default): black, greys, one orange. Day: paper white, greys, one blue.
  - Why: plants are watched around the clock. Night is easy on the eyes in a dark control room; day reads in a bright office. One set of names means a screen is built once and works in both.
  - Source: [Industry] [Task]
  - Differs from the industry habit: ISA-101 recommends a light-grey background to cut glare; the day theme follows it. Night is the default because watching continues through night shifts in dimmed rooms, where a bright screen glares. To confirm with operators.
- **One accent per theme. It marks the problem and the step in progress. It is never decoration.**
  - Why: the person on shift should find what is wrong within a second. Every decorative use of the accent is one more place the eye goes first.
  - Breaks if ignored: an orange chart line or icon competes with the real fault.
  - Source: [Industry] ISA-101 keeps alarm colours for the abnormal only. [Product]
  - Differs from the industry habit: ISA-101 plants use several alarm colours, one per priority. Green Control has one accent and no priority levels yet (see Open questions).
- **Calm by default: the screen is greys and the drawing.**
  - Why: most of the time nothing is wrong. A screen that is always busy teaches people to stop looking (alarm fatigue); a calm one makes the one problem stand out.
  - Source: [Industry] ISA-101: grey by default, colour only where attention is needed.
- **Square corners everywhere. Round shapes are only status dots and spinners.**
  - Why: when everything else is square, a round shape means "live state". Square also matches the straight lines of the isometric drawings.
  - Breaks if ignored: a pill-shaped Apply button reads like a status badge, and round stops meaning anything.
  - Source: [Product]
- **Floating panels are frosted glass (`surface.glass` + 24px blur). Blocks inside them are flat.**
  - Why: the AI is a layer over the machine, not a separate page, so the machine stays visible behind it. Blocks inside stay flat so their text stays sharp.
  - Source: [Product]
- **Sans (Hanken Grotesk) for sentences. Mono (DM Mono, uppercase, 11px) for labels, data and time.**
  - Why: numbers line up in mono. And measured data looks different from the AI's sentences, so people can tell a reading from an interpretation at a glance: the same idea as evidence first.
  - Source: [Product]
- **Motion uses one curve (`motion.ease`). Spring only for things that arrive. Respect reduced motion.**
  - Why: one curve makes every movement feel like the same product. A spring says "this is new" (a toast, a figure assembling), so it is kept for arrivals; used everywhere, nothing would feel new.
  - Source: [Product]; reduced motion from [Industry] WCAG.
- **Colours come in three layers:** `primitive.color.*` (raw values) → `color.*` semantic (what it means) → component (`cta-*`, `sel-*`, `badge-bg`). UI code only uses semantic or component tokens. A theme only re-points semantic tokens.
  - Why: a theme or brand change then edits one layer, not every screen.
  - Source: [Product]
- **Text reaches 4.5:1 on every background it sits on, in both themes. Graphics (meters, dots) reach 3:1.**
  - Why: WCAG AA, and plant screens are often read from a step away.
  - Source: [Industry]
- **Everything clickable shows a focus ring: 1.5px in the text colour, 2px out.**
  - Why: people using a keyboard must always see where they are.
  - Source: [Industry] WCAG

## Logo

A 5×5 dot "G" with one dot in the accent, where the letter turns inward. It sits top-left and nowhere else. Markup is in `green-control-components.css`. Do not draw a new logo, a coloured tile, or a letter in a rounded square.

## Every equipment screen is built around a drawing

Green Control does not show equipment as a table or an icon. It shows the machine. Start every screen from `shell.html`:

- **Rail** (64px) on the left: logo, icon nav, theme, avatar.
  - Why: icons only, because people spend a shift on one equipment screen and rarely switch sections. 64px fits a 44px tap target with 10px either side and leaves the most room for the drawing.
- **Stage** in the middle: title + state tag, mono crumbs (`B1 / PLANT / CH-02`), then the **figure**, then the **evidence row** (one card per check, tagged with the questions of this topic, joined by dashed lines).
- **Panel** (400px) on the right, frosted: the AI thread, an issue band in the accent, the ask box.
  - Why: on a 1440px screen it leaves 976px for the drawing, so the machine stays the largest thing. At 16px text, 400px less padding gives about 45 characters a line, short enough to take in a headline at a glance. Below 1024px the panel becomes a bottom sheet and the drawing stays on top.

### The figure (建模)

- An isometric line drawing of the real equipment, made with the **anatomy-figure** skill: dark theme, transparent background, outlines bright enough to read small, viewed from 62° azimuth (the camera turns 62° around the vertical axis), standard isometric elevation.
- Research the real object first and draw it as it is (where the motor, door, cells or pipes really sit).
- Exactly one part is lit, in the accent: the part with the problem. Everything else stays grey.
- On the drawing: `.alab` glass chips (key + value, mono; `.hot` only on the problem), `.afloor` labels on a building's left edge, numbered `.amark`s where each piece of evidence was read. The numbers match the evidence chips and cards; hovering one highlights all three.
- **The evidence row follows the question, not a template.** One card per source the AI actually checked (1 to 4), numbered in the order it checked them; never pad to three, never drop a check to fit. Each card's tag is the question a person would ask next about *this* topic, in plain words. Patterns:
  - Fault: What's wrong → Where → Why
  - Opportunity (a saving): What's coming → What we have → Does it fit (→ What else needs it, if that was checked)
  - Unsure (below 50%): What we see → What it could be (the competing causes). The check that would tell them apart is the suggestion, not a card.
  - A step is optional: skip Where when no separate check located the problem.
- **Competing causes** are listed whenever more than one is still possible, in the draft band (50–79) as well as below 50: the leading cause carries the confidence, the others read 'not ruled out'.
- **The person's next tap stays in reach.** When the thread is longer than the panel, it scrolls and the current Apply / Assign sits in a sticky bar at its bottom (`.gc-sticky`).
  - A single reading: one card, no row.
- Caption bottom-right in mono: `Fig. 02 — Chiller plant, iso 62°`.
- Night and day each have their own render of the figure.

### Particles (粒子)

- **Dot field** behind the figure: 0.55px dots on a 4.2px pitch (`surface.dot`), masked so it fades out before the edges and guides. It is the "ground" the drawing stands on; never put dots behind text.
- **Pool**: a soft radial glow (`surface.pool`) under the object in focus.
- **Assemble**: when a screen opens on a new figure, the drawing builds itself from its own points, falling top to bottom into place, then the line drawing resolves and the labels arrive (`gc-assemble.js`). Once per figure, never on every update. Off under reduced motion.

## The AI signal

The **spark** (five dots, centre dot in the accent) marks where the AI speaks or acts. Nothing else uses it: not empty states, not marketing, not upsells. If the spark is everywhere it stops meaning anything.

## AI states

| State | What the person sees |
|---|---|
| Watching | Readings only. No spark. |
| Detected | An alert card: what is wrong, where, how much it costs. One action: Investigate. Tag: Issue. |
| Opportunity | The same card for a saving the AI found, not a fault. Tag: Opportunity. |
| Investigating | The AI checks sources one at a time (what → where → why). Each check lands as a numbered evidence chip. |
| Proposed | A plan, one step at a time, on a rail. Behaviour depends on confidence (below). |
| Applied | A toast: what changed, with Undo. The action lands on the Actions timeline. |
| Undone | The AI says what it reversed, in one line. |

## Confidence decides what the AI may do

| Confidence | The AI may | The UI shows |
|---|---|---|
| 80% and up | Propose a plan | Plan + Apply button |
| 50% to 79% | Draft a plan | Draft label, evidence open, "Review" before Apply |
| Below 50% | Only suggest a check | No plan. "Ask a technician to check …" + Assign |

## How the AI speaks

The AI talks like a colleague reporting to the person on shift: not a chatbot, not a salesperson.

- **Seen → means → do.** Say what was measured, what it probably means, and the one next step. In that order.
- **Numbers and names, not adjectives.** "Door motor draws 18% more current since 06:10", not "abnormal behaviour detected". Equipment, teams and people are links.
- **The words follow the confidence band.**

| Band | Sounds like | Example |
|---|---|---|
| Plan (80% and up) | Plain and direct. Names the evidence, the saving or risk, and the plan. | "Tomorrow 14:00–17:00 will pass the 3,100 kW limit by 250 kW. Charging BT-01 tonight covers it and saves ¥21,500." |
| Draft (50–79%) | Leads with the likely cause and its number, then names what is not ruled out. | "Most likely the CT-2 fan (58%): it draws 9% more power and the water leaves 1.4 °C warmer. Fouled fill isn't ruled out yet. Review the steps before applying." |
| Check (below 50%) | Says plainly that it can't tell, why, and the one check that would tell. Never sounds like a fix. | "The data fits three causes equally, so I'm not suggesting a fix. A technician checking the sill track, door motor and light curtain covers all three in one visit." |

- **"I" only for what the AI did** ("I compared door current with its 30-day baseline"). Never "I think", "I feel", "I believe".
- **Never:** exclamation marks, "Don't worry", "Great news", "smart", "AI-powered", or a hedge with no next step ("might be worth looking into").
- **Undo and mistakes:** one line, own it, say the state now. "Undid the BT-01 schedule. The battery is back to a 60% reserve."
- **Length:** headline 12 words or fewer; body two sentences or fewer. Everything else belongs in the evidence.

## What the person is doing

Sort screens by the person's task, not by how they look. Each task asks something different of the screen. Operator response is commonly described as detect → diagnose → respond; Green Control adds review, because every step can be undone.

| Task | The person is… | The screen must | Green Control parts |
|---|---|---|---|
| **Detect** | scanning many machines, mostly normal | stay grey; make the one abnormal thing obvious at a glance; every alert asks for one action | dot field and drawing; alert card with one action (Investigate); accent only on the problem |
| **Diagnose** | working out why | show each reading against its normal range, in the order it was checked; say how sure | evidence chips and cards (bar against the normal range, 30-day baseline tick); confidence meter; competing causes |
| **Respond** | deciding what to do | offer one next step, sized to the confidence; change nothing without a tap | plan rail; Apply or Assign; owner row |
| **Review** | checking what happened, or taking it back | show what changed, when and by whom; offer Undo | toast with Undo; Actions timeline |

Source: [Industry] ISA-101 shows values against their normal range and ISA-18.2 asks every alarm for a defined response; [Task].

## Same everywhere, varies by rule

A screen should never differ by accident, and never be forced to look the same when the situation is different. This table says which is which.

| Same on every screen | Varies, and what decides it |
|---|---|
| Rail · stage with the drawing · AI panel | **How many evidence cards:** how many sources the AI actually checked (1 to 4) |
| Square corners; round only for live state | **The card tags:** the kind of situation (fault, opportunity, unsure) |
| The accent marks only the problem or the one action | **What the AI may do, and which buttons appear:** the confidence band (80+ plan, 50–79 draft, below 50 check) |
| The spark appears only where the AI speaks or acts | **How the AI words it:** the same confidence band |
| Every applied step can be undone; every machine name is a link | **The drawing and the lit part:** which machine, which part is at fault |
| Only token colours, sizes and radii | **The theme:** night or day re-points the colour meanings, never the structure |

Why this table exists: in 1.2 the evidence row was fixed at three cards. On a saving with nothing broken, agents had to invent a third tag to fill the row: forced sameness. 1.3 moved the card count from the left column to the right, decided by the real checks. When a new case does not fit, change this table first, then build.

## Rules

1. **Evidence before advice.** No plan appears before at least one evidence chip. [Product]
2. **People apply.** The AI never changes equipment on its own, except to switch back to a safe state; when it does, it says so. [Product] [Industry]
3. **Everything is undoable.** Every applied step offers Undo in the toast and on the timeline. [Product] [Task: review]
4. **Say less when unsure.** Below the review threshold the AI suggests a check, not a fix. [Product]
5. **Name the object.** Equipment, teams and work orders are links (glyph + underline), so people can open what the AI refers to. [Task: diagnose]

## How we would test the rules

The rules have been tested with AI agents (see Changelog): can an agent that has never seen the prototype build a new screen that follows them? They have not been tested with operators yet. The plan:

| Rule | Test with operators | Measure |
|---|---|---|
| Calm by default, one accent | One fault on a plant screen: the grey version against a colourful one | Time to find the fault; how often the wrong machine is picked |
| Every alert asks for one action | Replay a busy shift | Alerts per 10 minutes (ISA-18.2 treats more than 10 in 10 minutes as a flood); alerts closed with no action |
| Say less when unsure | Plans at 41%, 58% and 88% confidence | How often a plan is applied and then undone |
| Evidence before advice | The same plan with and without evidence cards | Whether the operator can say why the AI suggested it |

## Open questions

- **Priority.** ISA-18.2 asks for three or four alarm priorities. Green Control separates issue from opportunity but has no priority levels: when two faults arrive at once, which one gets the accent?
- **Night as the default.** It differs from ISA-101's light-grey background (see Look). Needs operators on night shifts to confirm.


## Components

AI panel (the frame stays the same; what goes inside changes with the situation) · Alert card · Evidence chip · Evidence card · Plan rail (check / step) · Confidence meter · Toast with Undo · Action row · Owner row (team + person on shift + Assign) · Causes list + Suggested check (below 50%) · Art box (keeps labels on the drawing) · Segmented control · Buttons (primary `.cta`, secondary `.pbtn`; square, no pill) · Logo.

## Machine check

`tools/gc_check.py` checks what a machine can: typed-in colours, contrast of every text/background pair in both themes, focus rings, buttons without a label, and drift between `tokens.json` and every file that copies its values. `tools/build_tokens.py` writes `tokens.json` into those files. Run both before handing work back.

## Changelog

- **1.8** Each component is shown in the situations it meets, with one line on what changes, instead of do/don't lists. New: AI panel, one frame for every AI answer (fault, saving, draft, low confidence), on desktop, tablet and phone.
- **1.7** Rules now say where they come from: [Industry] (ISA-101, ISA-18.2, WCAG), [Product] (evidence first, people decide) or [Task]. Two places where Green Control differs from the industry habit are written down with their reasons. New: screens sorted by what the person is doing (detect, diagnose, respond, review); a plan for testing the rules with operators; open questions.
- **1.6** Every look and layout rule now says why, and what breaks if it is ignored, so a person or an agent can tell a real exception from a mistake. New table: what stays the same on every screen, and what varies and by which rule.
- **1.5** Added "How the AI speaks": wording per confidence band, words the AI never uses, and how it reports Undo. The first machine check, `gc-check`, found what four rounds of reviewing screens had missed: secondary text (`muted`) fell short of 4.5:1 on raised and chip backgrounds in both themes (now #666662 day, #8f949c night); the component CSS had no keyboard focus ring; the Ask input's send button had none either; two near-identical blacks (#111214, #121214); and `registry.json`'s copy of the theme had been missing the badge colour since 1.1. Colours now have a primitive layer, and one script keeps every copy in sync.
- **1.4** From the 1.3 test (cooling tower 58%, EV charging 83%): motion token names now match the components; the evidence row tightens its gaps for 3 and 4 cards; the art box keeps any image's proportions; the assemble lines up inside the art box; a sticky action bar; an Opportunity tag; done plan steps; action rows positioned by variables; competing causes in the draft band; the 62° view defined.
- **1.3** From the 1.2 test (both agents): `gc-tokens.css` now exports space, type, radius, motion and the AI thresholds; evidence badges use one colour everywhere; an art box so labels stay pinned to the drawing at any size; components for the below-50% case (competing causes, suggested check) and an Owner row; the evidence badge is scoped so plan steps keep their hollow 'not yet' state; the evidence row follows the topic's questions instead of a fixed What → Where → Why.
- **1.2** The 1.1 screens followed the rules but looked like generic dark dashboards: no drawing, no particles. Added the screen shell, the stage CSS (dot field, pool, labels, marks, evidence row), the particle assemble script, the figure assets, and the rule that every equipment screen is built around an isometric drawing made with the anatomy-figure skill.
- **1.1** Two agents built new screens with this package and hit the same gaps: role colours (link, primary button, selection) and surface effects were missing from `tokens.json`, there was no button or segmented-control markup, the logo was undefined, and "pill" contradicted the square rule. All fixed.
- **1.0** First version, from the Green Control prototype.
</script>
<script type="text/plain" id="f-skill">---
name: green-control
description: Use whenever you create or change a Green Control (AI GC) screen or AI flow. One skill for the whole loop: decide what the AI may do, choose the evidence, build the screen, draw the machine, write the AI's words, review, and turn feedback into rules.
---

# Green Control

The one idea: **evidence first, people decide.** The AI may look, compare and suggest. Anything that changes a machine waits for a person, shows why, and can be undone.

Read `DESIGN.md` and `tokens.json` first: https://shuyii0315-arch.github.io/green-control/system/files/

Work through the steps in order. Steps 1, 2, 5, 6 and 7 are judgement calls; write down what you decided before you build.

For component details (motion, states, edge cases, accessibility, widths) use the component skills: `gc-motion`, `gc-states`, `gc-break-ui`, `gc-a11y`, `gc-responsive`.


## 1 · Decide what the AI may do

Green Control's first rule is *evidence first, people decide*. How far the AI may go depends on how sure it is. Make this call before any layout or wording.

### The bands

| Confidence | Band | The AI may | The screen shows |
|---|---|---|---|
| 80 and up | plan | propose a plan | plan rail + Apply |
| 50–79 | draft | draft a plan | "Draft" label, evidence open, Review before Apply |
| below 50 | check | only suggest a check | no plan; competing causes + one suggested check + Assign |

Thresholds live in `tokens.json` as `ai.confidence.act` (80) and `ai.confidence.review` (50). Read them; never hard-code.

### How to decide

1. Find the number. If the brief gives none, ask for it. Never pick one to make a screen look better.
2. Map it to a band with the table.
3. List competing causes whenever more than one is still possible, in the draft band as well as below 50. The leading cause carries the confidence; the others read "maybe" (draft) or all read "possible" (below 50).
4. Below 50, write the one check that would tell the causes apart. It is the suggestion, not an evidence card.
5. In every band: Apply needs a person's tap, and every applied step can be undone.

### Output

Write down the band, the reason, and what the screen must and must not show, before building:

```
Band: check (41%)
Why: the data fits three causes equally
Show: causes list (all "possible"), suggested check, Assign
Do not show: any fix, Apply, a plan rail
```

### Examples

- "The AI is 41% sure the door is slow because of debris. What do we show?" → check band, three causes, suggest one site visit.
- "88% sure charging BT-01 tonight avoids the peak." → plan band, plan + Apply + Undo.


## 2 · Choose the evidence

People decide only if they can see why. Evidence comes before any plan, and it follows the question a person would ask next, not a template.

### Rules

- One card per source the AI actually checked: 1 to 4. Never pad to three; never drop a real check to fit.
- Number cards in the order the AI checked them. The same number appears on the evidence chip, the card, and the mark on the drawing; hovering one highlights all three.
- Each card's tag is the next question about this topic, in plain words.
- A single reading is one card, no row.

### Question patterns

| Situation | Card tags, in order |
|---|---|
| Fault | What's wrong → Where → Why |
| Opportunity (a saving) | What's coming → What we have → Does it fit (→ What else needs it, if checked) |
| Unsure (below 50%) | What we see → What it could be |

Skip a step when no separate check answered it (for example, no Where if nothing located the fault).

### Each card holds

Number and source · the value with its unit · a bar against the normal range with the 30-day baseline tick · one caption line (when, compared with what). Old readings (over 15 min) are marked stale, never hidden.

### Example

"Why does the AI think Chiller 2 is the problem?" →
1 What's wrong: power +14% vs 30-day · 2 Where: Chiller 2, compressor · 3 Why: tubes 41 days past cleaning.


## 3 · Build the screen

Read `DESIGN.md` and `tokens.json` first: https://shuyii0315-arch.github.io/green-control/system/files/DESIGN.md · https://shuyii0315-arch.github.io/green-control/system/files/tokens.json

### Start

1. Decide the band with `gc-confidence` and the evidence with `gc-evidence`. Layout comes after.
2. Copy `shell.html` (https://shuyii0315-arch.github.io/green-control/system/files/shell.html) and keep its frame: rail (64px) · stage with the figure and the evidence row · frosted AI panel (400px) on the right.
3. Use the components. In React: `npx shadcn@latest add https://shuyii0315-arch.github.io/green-control/system/r/<name>.json` (registry: https://shuyii0315-arch.github.io/green-control/system/r/registry.json). In plain HTML: `green-control-components.css`.

### Always

- Only tokens, through CSS variables. No new colours, sizes, radii or shadows.
- Both themes: set `data-gc="night"` or `"day"` on the root and check both.
- Calm by default: the screen is greys and the drawing. One accent per screen, only for the problem or the one action to take.
- Square corners. Round only for status dots and spinners.
- Sans for sentences; mono 11px uppercase for labels, data and time.
- Reuse a component before making one. If none fits, stop and ask the designer.
- Each look rule in DESIGN.md says why. Before you break one, read its reason; and check the "Same everywhere, varies by rule" table to see whether what you want to change is allowed to vary. If the case is really new, change that table first, then build.
- The spark appears only where the AI speaks or acts.
- Every applied step: a toast with Undo, and a row on the Actions timeline.


## 4 · Draw the machine

Green Control never shows a machine as a table or an icon. Every equipment screen is built around a drawing of the real machine.

### The drawing

- Isometric line art, made with the **anatomy-figure** skill. Night render: dark, transparent background. Also a day render.
- Research the real machine first and draw it as it is (where the motor, door, cells or pipes really sit).
- View: 62° azimuth, standard isometric elevation. One batch of drawings shares one scale.
- **Exactly one part is lit, in the accent: the part with the problem.** Everything else stays grey. The lit part needs enough detail to be recognised on its own.
- Outlines bright enough to read at small sizes.

### On the drawing

- `.alab` glass labels (key + value, mono); `.hot` only on the problem.
- Numbered `.amark`s where each piece of evidence was read; numbers match the evidence chips and cards (see `gc-evidence`).
- Caption bottom-right in mono: `Fig. 02 — Chiller plant, iso 62°`.

### Around it

- Dot field behind the figure (0.55px dots, 4.2px pitch), fading before the edges; never behind text.
- A soft pool of light under the object in focus.
- When a screen opens on a new figure, it assembles once from its own points (`gc-assemble.js`). Never on every update; off under reduced motion.

### Check before using

Real structure? One part lit? Same scale as the rest of the batch? Readable small? If unsure, put it on the review desk (`gc-learn-rule`).


## 5 · Write what the AI says

The AI talks like a colleague reporting to the person on shift: not a chatbot, not a salesperson.

### Shape

**Seen → means → do.** What was measured, what it probably means, the one next step. In that order.
Headline 12 words or fewer. Body two sentences or fewer. Everything else belongs in the evidence.

### Words follow the band (see gc-confidence)

| Band | Sounds like | Example |
|---|---|---|
| plan (80+) | Plain and direct: evidence, saving or risk, the plan. | "Tomorrow 14:00–17:00 will pass the 3,100 kW limit by 250 kW. Charging BT-01 tonight covers it and saves ¥21,500." |
| draft (50–79) | Likely cause and its number first, then what is not ruled out. | "Most likely the CT-2 fan (58%): it draws 9% more power. Fouled fill isn't ruled out yet. Review the steps before applying." |
| check (<50) | Says it can't tell, why, and the one check. Never sounds like a fix. | "The data fits three causes equally, so I'm not suggesting a fix. One visit to the door covers all three." |

### Always

- Numbers and names, not adjectives: "Door motor draws 18% more current since 06:10", not "abnormal behaviour".
- Equipment, teams and work orders are links.
- "I" only for what the AI did ("I compared door current with its 30-day baseline").

### Never

"I think / I feel / I believe" · exclamation marks · "Don't worry" · "Great news" · "smart" · "AI-powered" · a hedge with no next step ("might be worth looking into").

### Undo and mistakes

One line, own it, say the state now: "Undid the BT-01 schedule. The battery is back to a 60% reserve."


## 6 · Review: pass or block

Strict. A screen passes only when every check below holds. Report each finding with where it is and why it matters.

### 1. The five rules (block if any fails)

1. **Evidence before advice:** at least one evidence chip appears before any plan.
2. **People apply:** nothing changes a machine without a person's tap.
3. **Everything is undoable:** each applied step has Undo in a toast and on the timeline.
4. **Say less when unsure:** the plan's form and the words match the band (`gc-confidence`, `gc-ai-voice`). Below 50% there is no fix and no Apply.
5. **Name the object:** equipment, teams and work orders are links.

### 2. The look

- Built around the drawing (`gc-draw-equipment`); one part lit.
- Only tokens: no typed-in colour, size or radius.
- One accent per screen, only for the problem or the one action.
- Night and day both readable; text 4.5:1, graphics 3:1.
- Focus ring on everything clickable; reduced motion turns animation off.
- The spark only on AI content; the logo only top-left.

### 3. The machine check

Run `python3 tools/gc_check.py <folder>` (colours, contrast in both themes, focus rings, unlabeled buttons, token drift). 0 errors to pass. If it flags something you believe is right, say so; never hide it.

### Output

```
Verdict: BLOCK
1. Rule 4 · Elevator panel shows "Apply fix" at 41%. Below 50% only a check is allowed. → Replace with suggested check + Assign.
2. Look · #ff7a00 typed in .badge. → Use var(--accent).
```


## 7 · Turn feedback into rules

Rules grow from real feedback, not from one person's guess. Sources: the review desk (results page → "Copy all data", JSON) and the corrections the designer made in the session.

### Steps

1. Collect every correction: grades marked okay or redo, the problems ticked, graders' notes, and edits the designer made by hand.
2. Group them. The same problem on several drawings or screens is one rule.
3. Tag where it comes from: [Industry] (ISA-101, ISA-18.2, WCAG), [Product] or [Task]. If it differs from the industry habit, say so and why.
4. Write each rule as an instruction a future agent can follow, generalised to every similar case ("Light one part only, never a whole assembly", not "fix the charger").
5. **Attach the reason.** Use the graders' or designer's own words. Never invent one: if nobody said why, propose a reason and mark it *to confirm*.
6. Add where it came from: batch, how many people, which roles, which drawings.
7. If a machine could catch it, propose a check for `gc_check.py` instead of a sentence.
8. Write it into DESIGN.md and add a Changelog line. Remove rules that are now covered by a newer one.

### Format

```
### Give the lit part enough detail to be recognised on its own.
- Why: "Part unclear" ticked 5 times, on the EV fast charger (design 2, engineering 2, product 1).
- In their words: "The whole charger is orange; I can't tell which cable is broken."
- Source: review desk · batch-1
```

### Then

Redraw or rebuild what was graded redo, using the new rule, and send it back to the desk for the next round.
</script>
<script type="text/plain" id="f-llms"># Green Control Design System

> The design system behind AI GC · Green Control, an AI that watches a building's energy plant with the people who run it. Rule zero: evidence first, people decide. The AI may look, compare and suggest; anything that changes a machine waits for a person, shows why, and can be undone.

## Files

- [DESIGN.md](files/DESIGN.md): the idea, the look, the AI states, the confidence bands and the five rules, in plain words.
- [SKILL.md](files/SKILL.md): an agent skill. Load it before creating or changing any Green Control screen; it ends with a checklist.
- [tokens.json](files/tokens.json): colours, type, space, radius, motion and the AI confidence thresholds, in W3C Design Tokens (DTCG) format. Night is the default value; day is in $extensions.
- [shell.html](files/shell.html): the screen shell every equipment screen starts from: rail, stage with the figure and evidence row, AI panel.
- [gc-stage.css](files/gc-stage.css): dot field, pool glow, labels and numbered marks on the drawing, evidence row.
- [gc-assemble.js](files/gc-assemble.js): the particle assemble that builds a figure from its points when a screen opens.
- [gc-tokens.css](files/gc-tokens.css): every token as gc-* CSS variables, night and day.
- Components added in 1.3 (owner row, causes list, suggested check, art box) are in gc-stage.css and green-control-components.css.
- Figures: draw equipment with the anatomy-figure skill (isometric line art, one part lit in the accent).
- [registry.json](r/registry.json): shadcn-format registry.
  - [green-control-theme](r/green-control-theme.json): every token as CSS variables, light = day, dark = night.
  - [green-control-components](r/green-control-components.json): CSS for the AI components. Depends on the theme.

Install: `npx shadcn@latest add https://shuyii0315-arch.github.io/green-control/system/r/green-control-theme.json https://shuyii0315-arch.github.io/green-control/system/r/green-control-components.json`

## Rules an agent must follow

1. Show at least one evidence chip before any plan. One card per real check; tag cards with this topic's questions, not a fixed What/Where/Why.
2. Confidence 80+: plan with Apply. 50–79: draft, evidence open, Review before Apply. Below 50: no plan, suggest a check.
3. Never change equipment without a person's tap. Every applied step gets a toast with Undo.
4. Use the spark icon only where the AI speaks or acts.
5. Build every equipment screen around an isometric drawing of the machine (anatomy-figure), with the dot field and the assemble.
6. Tokens only. Square corners. One accent per screen. Build night and day.

<script type="text/plain" id="f-stage">/* Green Control stage: the drawing area every equipment screen is built around.
   Needs the gc tokens (tokens.json) and green-control-components.css.
   Pieces: dot field, pool glow, isometric figure, labels on the drawing, numbered marks, evidence row with dashed connectors. */

.gc-app { position: absolute; left: 50%; top: 50%; width: 1440px; height: 900px; transform-origin: 50% 50%; background: var(--bg-page); color: var(--text); overflow: hidden; font-family: "Hanken Grotesk", system-ui, sans-serif; }

/* left rail: logo, icon nav, theme + avatar at the foot */
.gc-rail { position: absolute; left: 0; top: 0; bottom: 0; width: 64px; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 4px; }
.gc-rail .logo { margin-bottom: 120px; }
.gc-rail button { width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); background: none; border: 0; cursor: pointer; }
.gc-rail button.on { background: var(--sel-bg); color: var(--sel-fg); }
.gc-rail svg.ic { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.gc-rail .foot { margin-top: auto; display: grid; gap: 8px; justify-items: center; }
.gc-rail .who { width: 28px; height: 28px; display: grid; place-items: center; background: var(--bg-raised); font: 10px/1 "DM Mono", monospace; }

/* stage: title, crumbs, figure, evidence row */
.gc-stage { position: absolute; left: 64px; top: 0; width: 976px; height: 900px; }
.gc-head { position: absolute; left: 44px; top: 28px; }
.gc-head h1 { margin: 0; display: flex; align-items: center; gap: 12px; font-size: 24px; line-height: 30px; font-weight: 500; letter-spacing: -0.015em; }
.gc-crumbs { margin-top: 10px; display: flex; gap: 8px; font: 11px/14px "DM Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

/* the art box: wrap the image and its labels in one box with the image's aspect ratio,
   so labels placed in % land on the same spot of the drawing at any size:
   <div class="gc-artbox" style="aspect-ratio: 1520 / 1039"><img class="gc-art" …><div class="gc-labels">…</div></div> */
.gc-artbox { position: absolute; left: 50%; top: 50%; width: min(92cqw, calc(92cqh * var(--ar, 1.46))); transform: translate(-50%, -50%); }
/* set --ar to the image's width / height, e.g. style="--ar: 1520 / 1039; aspect-ratio: 1520 / 1039" */
.gc-artbox .gc-art { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; transform: none; left: 0; top: 0; }

/* the figure: dots behind, pool under the object in focus, drawing on top, labels above */
.gc-figure { position: absolute; left: 0; right: 0; top: 96px; height: 560px; container-type: size; }
.dots { position: absolute; inset: 0; background-image: radial-gradient(var(--dot) 0.55px, transparent 0.75px); background-size: 4.2px 4.2px; -webkit-mask-image: radial-gradient(ellipse 58% 60% at 50% 50%, #000 40%, transparent 100%); mask-image: radial-gradient(ellipse 58% 60% at 50% 50%, #000 40%, transparent 100%); pointer-events: none; }
.pool { position: absolute; left: 18%; top: 28%; width: 64%; height: 56%; background: radial-gradient(closest-side, var(--pool), transparent); pointer-events: none; }
.gc-art { position: absolute; left: 50%; top: 50%; max-width: 86%; max-height: 96%; transform: translate(-50%, -50%); display: block; -webkit-user-drag: none; transition: opacity 600ms var(--ease); }
.gc-figure.assembling .gc-art { opacity: 0; transition: none; }
.gc-assemble { position: absolute; pointer-events: none; transition: opacity 600ms var(--ease); }
.gc-figure.built .gc-assemble { opacity: 0; }
.gc-labels { position: absolute; inset: 0; pointer-events: none; }
.gc-figure.assembling .gc-labels { opacity: 0; }
.gc-figure.built .gc-labels > * { animation: gcPop 420ms var(--spring) both; }
.gc-figure.built .gc-labels > :nth-child(n+2) { animation-delay: 120ms; }
.gc-figure.built .gc-labels > :nth-child(n+4) { animation-delay: 240ms; }
@keyframes gcPop { from { opacity: 0; transform: translateY(4px); } }
.gc-cap { position: absolute; right: 44px; bottom: 6px; font: 10px/12px "DM Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

/* labels on the drawing: a small glass chip with a key and a value; .hot only on the problem */
.alab { position: absolute; display: flex; gap: 8px; align-items: center; height: 24px; padding: 0 8px; font: 12px/1 "DM Mono", monospace; white-space: nowrap; pointer-events: auto; background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: inset 0 0 0 1px var(--line); }
.alab.hot { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.alab .k { text-transform: uppercase; letter-spacing: 0.04em; }
.alab .v { color: var(--muted); }
.alab.hot .v { color: var(--accent); }
/* floor / zone labels on the left edge of a building, with a short hairline */
.afloor { position: absolute; display: flex; align-items: center; gap: 8px; transform: translateX(-100%); font: 11px/1 "DM Mono", monospace; letter-spacing: 0.05em; color: var(--muted); }
.afloor::after { content: ""; width: 14px; height: 1px; background: var(--muted); opacity: 0.6; }
.afloor.on { color: var(--text); }

/* numbered marks: where each piece of evidence was read on the machine; same number as the chip */
.amark { position: absolute; width: 18px; height: 18px; display: grid; place-items: center; background: var(--badge-bg); color: var(--on-accent); font: 11px/1 "DM Mono", monospace; transform: translate(-50%, -50%); }
.amark.scan::after { content: ""; position: absolute; inset: -6px; border: 1px solid var(--accent); animation: gcScan 900ms var(--ease) infinite; }
@keyframes gcScan { from { transform: scale(0.6); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }

/* linked highlight: hovering a chip, a card or a mark draws a border around all three */
.hl { outline: 1.5px solid var(--accent); outline-offset: 3px; transition: outline-color 200ms; }

/* evidence row under the drawing: one card per check (1–4), tagged with this topic's questions, joined by dashed lines */
.gc-evrow { --evgap: 100px; position: absolute; left: 40px; right: 40px; bottom: 40px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--evgap); }
.gc-evrow:has(> :nth-child(3)) { --evgap: 72px; }
.gc-evrow:has(> :nth-child(4)) { --evgap: 28px; }
.gc-evrow:has(> :only-child) { right: auto; width: 320px; }
.gc-ev { position: relative; padding: 14px 16px; display: grid; gap: 8px; }
.gc-ev .tag { position: absolute; left: 0; top: -22px; padding: 2px 6px; background: var(--bg-raised); font: 10px/14px "DM Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.gc-ev + .gc-ev::before { content: ""; position: absolute; left: calc(var(--evgap) * -1 + 4px); width: calc(var(--evgap) - 8px); top: 50%; border-top: 1px dashed var(--muted); }
.gc-ev .val { display: flex; align-items: baseline; gap: 6px; font-size: 34px; line-height: 38px; font-weight: 300; letter-spacing: -0.02em; }
.gc-ev .val small { font-size: 15px; color: var(--muted); letter-spacing: 0; }

/* right panel: the AI thread, frosted, full height */
.gc-panel { position: absolute; right: 0; top: 0; bottom: 0; width: 400px; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.gc-panel-head { height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 20px; }
.gc-band { margin: 0 20px 14px; display: flex; gap: 12px; padding: 6px 16px; background: var(--accent); color: var(--on-accent); font: 11px/14px "DM Mono", monospace; letter-spacing: 0.04em; text-transform: uppercase; }
.gc-thread { flex: 1; min-height: 0; overflow: auto; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 14px; }
.gc-ask { margin: 0 16px 16px; height: 44px; display: flex; align-items: center; padding: 0 6px 0 14px; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font-size: 14px; }

@media (prefers-reduced-motion: reduce) {
  .gc-figure.built .gc-labels > *, .amark.scan::after { animation: none; }
}

/* numbered badge in evidence cards and chips. Scoped, so the plan rail keeps its hollow 'not yet' steps. */
.gc-ev .num, .echip .num { width: 18px; height: 18px; display: inline-grid; place-items: center; background: var(--badge-bg); color: var(--on-accent); font: 11px/1 "DM Mono", monospace; vertical-align: -3px; margin-right: 6px; }

/* below 50%: competing causes and a suggested check, never a fix */
.gc-causes { display: grid; }
.gc-causes > div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.gc-causes > div .t-label { color: var(--muted); }
.gc-check { padding: 16px; display: grid; gap: 10px; }
.gc-check ol { margin: 0; padding-left: 18px; font-size: 14px; line-height: 22px; }

/* the action a person must take stays reachable: the bar sticks to the bottom of the thread while it scrolls */
.gc-sticky { position: sticky; bottom: -24px; margin: 0 -20px -24px; padding: 12px 20px 16px; display: flex; gap: 8px; align-items: center; background: var(--glass-raised); box-shadow: 0 -1px 0 var(--line); }
/* opportunity: same signal as an issue, different word */
.state.opportunity { color: var(--accent); }
/* plan step done */
.pl-item.done .num { background: none; box-shadow: inset 0 0 0 1px var(--muted); color: var(--muted); }
.pl-item.done .pl-body { color: var(--muted); }
/* action row positions as variables: style="--start: 12%; --len: 46%; --now: 52%; --plan: 78%" */
.acrow .run { left: var(--start, 12%); width: var(--len, 46%); }
.acrow .now { left: var(--now, 52%); }
.acrow .plan { left: var(--plan, 78%); }
.acrow.no-track .track { display: none; }
</script>
<script type="text/plain" id="f-assemble">/* Green Control particle assemble.
   The drawing builds itself from its own pixels: every opaque pixel (step 3) becomes a point that falls
   from above into place, top rows first. Then the line drawing resolves over the points and the labels arrive.
   Use once, when a screen opens on a new figure. Skipped under reduced motion.

   Markup:  <div class="gc-figure assembling"> … <img class="gc-art" src="figure.png"> … </div>
   Call:    gcAssemble(document.querySelector(".gc-art"));                                        */
window.gcAssemble = async function gcAssemble(img) {
  const fig = img.closest(".gc-figure");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { fig.classList.remove("assembling"); fig.classList.add("built"); return; }
  try { await img.decode(); } catch (e) { fig.classList.remove("assembling"); fig.classList.add("built"); return; }
  const W = img.naturalWidth, H = img.naturalHeight;

  const cv = document.createElement("canvas"); cv.className = "gc-assemble"; cv.width = W; cv.height = H;

  let LANG = "en";
  try { if (localStorage.getItem("gc-lang") === "zh") LANG = "zh"; } catch (e) {}
  const orig = new WeakMap();
  const skip = (p) => !p || p.closest("script,style,pre,code,textarea,[data-notr]");
  function tr(n) {
    if (skip(n.parentElement)) return;
    if (!orig.has(n)) orig.set(n, n.nodeValue);
    const o = orig.get(n), k = o.trim();
    let v = LANG === "zh" && ZH[k] ? o.replace(k, ZH[k]) : o;
    if (n.parentElement.closest(".t-label")) v = v.replace(/ · /g, "\u2009·\u2009");
    if (n.nodeValue !== v) n.nodeValue = v;
  }
  function trPh(el) {
    if (!el.dataset.ph) el.dataset.ph = el.getAttribute("placeholder");
    const o = el.dataset.ph; el.setAttribute("placeholder", LANG === "zh" && ZH[o] ? ZH[o] : o);
  }
  function walk(root) {
    if (root.nodeType === 3) return tr(root);
    if (root.nodeType !== 1) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
    while ((n = w.nextNode())) tr(n);
    root.querySelectorAll && root.querySelectorAll("[placeholder]").forEach(trPh);
  }
  const opts = { subtree: true, childList: true, characterData: true };
  const obs = new MutationObserver((muts) => {
    obs.disconnect();
    for (const m of muts) {
      if (m.type === "characterData") { orig.set(m.target, m.target.nodeValue); tr(m.target); }
      else m.addedNodes.forEach(walk);
    }
    obs.observe(document.body, opts);
  });
  function set(l) {
    LANG = l;
    try { localStorage.setItem("gc-lang", l); } catch (e) {}
    document.documentElement.lang = l === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("#langSeg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === l));
    obs.disconnect(); walk(document.body); obs.observe(document.body, opts);
  }
  document.querySelectorAll("#langSeg button").forEach((b) => b.addEventListener("click", () => set(b.dataset.lang)));
  set(LANG);
})();
