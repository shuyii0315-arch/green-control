<script>window.GC_REACT = {"button": "import * as React from \"react\"\nimport { cva, type VariantProps } from \"class-variance-authority\"\nimport { cn } from \"@/lib/utils\"\nimport { Spinner } from \"@/components/ui/spinner\"\n\n/**\n * Green Control button.\n * Square. One `primary` per view: the person's next decision (Investigate, Apply, Assign).\n * States: hover, focus-visible, active (press), disabled, loading.\n * When `loading`, the label should say what is happening (\"Applying…\").\n */\nconst buttonVariants = cva(\n  \"inline-flex shrink-0 cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-none font-medium outline-none transition-[background-color,transform,opacity] duration-[260ms] ease-spring active:duration-75 active:ease-out focus-visible:outline-[1.5px] focus-visible:outline-offset-2 focus-visible:outline-foreground active:scale-[0.97] disabled:cursor-not-allowed disabled:opacity-40 disabled:active:scale-100 motion-reduce:transition-none\",\n  {\n    variants: {\n      variant: {\n        primary: \"bg-primary text-primary-foreground hover:bg-primary/80 active:bg-primary/65\",\n        secondary: \"bg-transparent text-foreground shadow-[inset_0_0_0_1px_var(--border)] hover:bg-secondary active:bg-secondary\",\n        ghost: \"bg-transparent text-muted-foreground hover:bg-secondary hover:text-foreground\",\n      },\n      size: {\n        default: \"h-9 px-3.5 text-sm\",\n        sm: \"h-8 px-3 text-[13px]\",\n      },\n    },\n    defaultVariants: { variant: \"primary\", size: \"default\" },\n  }\n)\n\nexport interface ButtonProps\n  extends React.ButtonHTMLAttributes<HTMLButtonElement>,\n    VariantProps<typeof buttonVariants> {\n  /** Sent and waiting. Locks the button and shows a spinner. */\n  loading?: boolean\n}\n\nexport function Button({ className, variant, size, loading = false, disabled, children, ...props }: ButtonProps) {\n  return (\n    <button\n      data-slot=\"button\"\n      aria-busy={loading || undefined}\n      disabled={disabled || loading}\n      className={cn(buttonVariants({ variant, size }), loading && \"cursor-progress disabled:opacity-100\", className)}\n      {...props}\n    >\n      {loading && <Spinner />}\n      {children}\n    <\/button>\n  )\n}\n\nexport { buttonVariants }\n", "state-tag": "import { cn } from \"@/lib/utils\"\n\n/**\n * What state an object is in: a glyph and a word. All glyphs share one 10px box.\n * square = neutral (watching, investigating) · triangle = a problem · diamond = a chance to save · tick = done.\n * Only `issue` and `opportunity` use the signal colour. Never the glyph alone.\n */\ntype State = \"watching\" | \"issue\" | \"opportunity\" | \"investigating\" | \"resolved\"\n\nconst LABEL: Record<State, string> = { watching: \"Watching\", issue: \"Issue\", opportunity: \"Opportunity\", investigating: \"Investigating\", resolved: \"Resolved\" }\n\nconst TEXT: Record<State, string> = {\n  watching: \"text-muted-foreground\",\n  issue: \"text-signal\",\n  opportunity: \"text-foreground\",\n  investigating: \"text-foreground\",\n  resolved: \"text-muted-foreground\",\n}\n\nfunction Glyph({ state }: { state: State }) {\n  const common = \"size-2.5 shrink-0\"\n  if (state === \"issue\") return <svg viewBox=\"0 0 10 10\" aria-hidden=\"true\" className={cn(common, \"fill-current\")}><path d=\"M5 1.2 9.4 8.8H.6z\" /><\/svg>\n  if (state === \"opportunity\") return <svg viewBox=\"0 0 10 10\" aria-hidden=\"true\" className={cn(common, \"fill-signal\")}><path d=\"M5 .8 9.2 5 5 9.2.8 5z\" /><\/svg>\n  if (state === \"resolved\") return <svg viewBox=\"0 0 10 10\" aria-hidden=\"true\" className={cn(common, \"fill-none stroke-current stroke-[1.6]\")}><path d=\"M1.5 5.2 4 7.5 8.5 2.5\" /><\/svg>\n  return (\n    <svg viewBox=\"0 0 10 10\" aria-hidden=\"true\" className={cn(common, \"fill-current\", state === \"investigating\" && \"animate-pulse motion-reduce:animate-none\")}>\n      <rect x=\"2\" y=\"2\" width=\"6\" height=\"6\" />\n    <\/svg>\n  )\n}\n\nexport interface StateTagProps {\n  state?: State\n  /** Overrides the default word, e.g. \"+14% power\". */\n  children?: React.ReactNode\n  className?: string\n}\n\nexport function StateTag({ state = \"watching\", children, className }: StateTagProps) {\n  return (\n    <span data-slot=\"state-tag\" data-state={state} className={cn(\"inline-flex items-center gap-1.5 text-[13px] leading-[19px]\", TEXT[state], className)}>\n      <Glyph state={state} />\n      {children ?? LABEL[state]}\n    <\/span>\n  )\n}\n", "object-link": "import * as React from \"react\"\nimport { cn } from \"@/lib/utils\"\n\n/**\n * Whenever the AI names a machine, a team or a work order, it is an object link:\n * a dot and an underlined name that opens exactly that thing.\n * `missing`: the object was removed; the name stays readable, struck through.\n */\nexport interface ObjectLinkProps extends React.AnchorHTMLAttributes<HTMLAnchorElement> {\n  missing?: boolean\n}\n\nexport function ObjectLink({ missing = false, className, children, ...props }: ObjectLinkProps) {\n  return (\n    <a\n      data-slot=\"object-link\"\n      aria-disabled={missing || undefined}\n      className={cn(\n        \"inline-flex cursor-pointer items-center gap-1.5 text-link underline decoration-1 underline-offset-[3px] outline-none transition-[text-decoration-thickness,background-color] duration-150 hover:bg-link/8 hover:decoration-2 focus-visible:outline-[1.5px] focus-visible:outline-offset-2 focus-visible:outline-foreground\",\n        \"before:size-1.5 before:shrink-0 before:rounded-full before:bg-current before:content-[''] before:transition-transform before:duration-[260ms] before:ease-spring hover:before:scale-[1.4]\",\n        missing && \"pointer-events-none cursor-default text-muted-foreground line-through before:bg-transparent before:shadow-[inset_0_0_0_1px_currentColor]\",\n        className\n      )}\n      {...props}\n    >\n      {children}\n    <\/a>\n  )\n}\n", "evidence-chip": "import { cn } from \"@/lib/utils\"\nimport { Spinner } from \"@/components/ui/spinner\"\n\n/**\n * One chip per source the AI checked, numbered in the order it checked them.\n * The same number marks the spot on the drawing and heads the evidence card.\n */\nexport interface EvidenceChipProps {\n  n: number\n  label: string\n  /** checking: being read · landed: done · stale: older than 15 min */\n  status?: \"checking\" | \"landed\" | \"stale\"\n  /** Its card is open below. */\n  selected?: boolean\n  /** Its card or drawing mark is hovered elsewhere. */\n  linked?: boolean\n  age?: string\n  className?: string\n}\n\nexport function EvidenceChip({ n, label, status = \"landed\", selected = false, linked = false, age = \"15 min\", className }: EvidenceChipProps) {\n  return (\n    <span\n      data-slot=\"evidence-chip\"\n      data-status={status}\n      aria-busy={status === \"checking\" || undefined}\n      className={cn(\n        \"inline-flex h-7 items-center gap-1.5 bg-raised pr-2 pl-[5px] text-[13px] transition-[box-shadow,background-color] duration-200 hover:shadow-[0_0_0_1.5px_var(--gc-accent)]\",\n        linked && \"shadow-[0_0_0_1.5px_var(--gc-accent)]\",\n        selected && \"bg-foreground text-background\",\n        status === \"checking\" && \"text-muted-foreground\",\n        status === \"stale\" && \"opacity-60\",\n        className\n      )}\n    >\n      {status === \"checking\" ? (\n        <Spinner className=\"mx-0.5\" />\n      ) : (\n        <span className={cn(\"grid size-4 place-items-center font-mono text-[10px]\", selected ? \"bg-background text-foreground\" : \"bg-[var(--gc-badge-bg)] text-on-signal\")}>{n}<\/span>\n      )}\n      {label}\n      {status === \"stale\" && <span className=\"ml-1 font-mono text-xs text-muted-foreground\">{age}<\/span>}\n    <\/span>\n  )\n}\n", "confidence-meter": "import { cn } from \"@/lib/utils\"\n\n/**\n * Twenty square segments and a number. The band decides what the AI may do:\n * 80+ plan · 50–79 draft · below 50 check only (segments turn to the signal colour).\n */\nexport const CONFIDENCE_ACT = 80\nexport const CONFIDENCE_REVIEW = 50\n\nexport function confidenceBand(value: number) {\n  return value >= CONFIDENCE_ACT ? \"plan\" : value >= CONFIDENCE_REVIEW ? \"draft\" : \"check\"\n}\n\nexport interface ConfidenceMeterProps {\n  value: number\n  /** A new reading is coming in. */\n  updating?: boolean\n  className?: string\n}\n\nexport function ConfidenceMeter({ value, updating = false, className }: ConfidenceMeterProps) {\n  const on = Math.round((value / 100) * 20)\n  const low = value < CONFIDENCE_REVIEW\n  return (\n    <div data-slot=\"confidence-meter\" data-band={confidenceBand(value)} className={cn(\"grid w-full min-w-[220px] gap-1.5\", className)}>\n      <div className=\"flex items-baseline justify-between\">\n        <span className=\"font-mono text-[11px] uppercase tracking-[0.05em] text-muted-foreground\">Confidence<\/span>\n        <span className=\"font-mono text-xs\">{value}%<\/span>\n      <\/div>\n      <div className=\"flex h-2 gap-0.5\" role=\"meter\" aria-valuenow={value} aria-valuemin={0} aria-valuemax={100} aria-label=\"AI confidence\">\n        {Array.from({ length: 20 }, (_, i) => (\n          <i\n            key={i}\n            className={cn(\"flex-1\", i < on ? (low ? \"bg-signal\" : \"bg-foreground\") : \"bg-border\", updating && \"animate-pulse motion-reduce:animate-none\")}\n            style={updating ? { animationDelay: `${(i % 4) * 120}ms` } : undefined}\n          />\n        ))}\n      <\/div>\n    <\/div>\n  )\n}\n", "ask-input": "import * as React from \"react\"\nimport { cn } from \"@/lib/utils\"\nimport { Spinner } from \"@/components/ui/spinner\"\n\n/**\n * Where a person asks the AI about the object on screen.\n * The placeholder names that object, so the question has a context.\n * States: empty · hover · focus · filled (send on) · sending · error (keeps the text).\n */\nexport interface AskInputProps {\n  object: string\n  sending?: boolean\n  error?: string\n  defaultValue?: string\n  onSend?: (text: string) => void\n  className?: string\n}\n\nexport function AskInput({ object, sending = false, error, defaultValue = \"\", onSend, className }: AskInputProps) {\n  const [value, setValue] = React.useState(defaultValue)\n  const canSend = value.trim().length > 0 && !sending\n  return (\n    <div className={cn(\"grid w-full max-w-[340px] gap-1.5\", className)}>\n      <form\n        data-slot=\"ask-input\"\n        onSubmit={(e) => { e.preventDefault(); if (canSend) onSend?.(value) }}\n        className={cn(\n          \"flex h-11 items-center gap-2 bg-background pr-[5px] pl-3.5 shadow-[inset_0_0_0_1px_var(--border)] transition-shadow duration-200 hover:shadow-[inset_0_0_0_1px_var(--muted-foreground)] focus-within:shadow-[inset_0_0_0_1.5px_var(--foreground)]\",\n          error && \"shadow-[inset_0_0_0_1.5px_var(--gc-accent)] hover:shadow-[inset_0_0_0_1.5px_var(--gc-accent)]\",\n          sending && \"opacity-70\"\n        )}\n      >\n        <input\n          value={value}\n          onChange={(e) => setValue(e.target.value)}\n          disabled={sending}\n          placeholder={`Ask about ${object}…`}\n          aria-label={`Ask Green Control about ${object}`}\n          aria-invalid={!!error || undefined}\n          className=\"h-full min-w-0 flex-1 bg-transparent text-sm outline-none placeholder:text-muted-foreground\"\n        />\n        <button\n          type=\"submit\"\n          disabled={!canSend}\n          aria-label=\"Send\"\n          className=\"grid size-[34px] cursor-pointer place-items-center bg-primary text-primary-foreground outline-none transition-colors focus-visible:outline-[1.5px] focus-visible:outline-offset-2 focus-visible:outline-foreground disabled:cursor-not-allowed disabled:bg-secondary disabled:text-muted-foreground\"\n        >\n          {sending ? <Spinner /> : <svg viewBox=\"0 0 14 14\" className=\"size-3.5 fill-none stroke-current stroke-[1.6]\"><path d=\"M2.5 7h9M7.5 3l4 4-4 4\" /><\/svg>}\n        <\/button>\n      <\/form>\n      {error && <span role=\"alert\" className=\"text-[13px] text-signal\">{error}<\/span>}\n    <\/div>\n  )\n}\n", "segmented": "import * as React from \"react\"\nimport { cn } from \"@/lib/utils\"\n\n/**\n * Two to four options of the same thing (Night / Day, 7d / 30d). One is always on.\n * The selection slides to the new option instead of jumping, so the eye follows the change.\n */\nexport interface SegmentedOption<T extends string> {\n  value: T\n  label: string\n  disabled?: boolean\n}\n\nexport interface SegmentedControlProps<T extends string> {\n  options: SegmentedOption<T>[]\n  value: T\n  onChange: (value: T) => void\n  /** Read out by screen readers, e.g. \"Theme\". */\n  label?: string\n  className?: string\n}\n\nexport function SegmentedControl<T extends string>({ options, value, onChange, label, className }: SegmentedControlProps<T>) {\n  const refs = React.useRef<Record<string, HTMLButtonElement | null>>({})\n  const [box, setBox] = React.useState<{ x: number; w: number } | null>(null)\n  const first = React.useRef(true)\n\n  React.useLayoutEffect(() => {\n    const place = () => {\n      const el = refs.current[value]\n      if (el) setBox({ x: el.offsetLeft, w: el.offsetWidth })\n    }\n    place()\n    window.addEventListener(\"resize\", place)\n    return () => window.removeEventListener(\"resize\", place)\n  }, [value, options])\n\n  React.useEffect(() => {\n    first.current = false\n  }, [])\n\n  return (\n    <div data-slot=\"segmented\" role=\"group\" aria-label={label} className={cn(\"relative isolate inline-flex p-0.5 shadow-[inset_0_0_0_1px_var(--border)]\", className)}>\n      {box && (\n        <span\n          aria-hidden=\"true\"\n          className={cn(\"absolute inset-y-0.5 left-0 -z-10 bg-[var(--gc-sel-bg)] motion-safe:transition-[transform,width] motion-safe:duration-300 motion-safe:ease-gc\", first.current && \"transition-none\")}\n          style={{ width: box.w, transform: `translateX(${box.x}px)` }}\n        />\n      )}\n      {options.map((o) => (\n        <button\n          key={o.value}\n          ref={(el) => {\n            refs.current[o.value] = el\n          }}\n          type=\"button\"\n          aria-pressed={o.value === value}\n          disabled={o.disabled}\n          onClick={() => onChange(o.value)}\n          className={cn(\n            \"h-7 px-3 text-[13px] text-muted-foreground outline-none transition-colors duration-200 ease-gc hover:text-foreground\",\n            \"focus-visible:outline-[1.5px] focus-visible:-outline-offset-2 focus-visible:outline-foreground\",\n            \"aria-pressed:text-[var(--gc-sel-fg)] aria-pressed:hover:text-[var(--gc-sel-fg)]\",\n            \"disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:text-muted-foreground\"\n          )}\n        >\n          {o.label}\n        <\/button>\n      ))}\n    <\/div>\n  )\n}\n", "spark": "import { cn } from \"@/lib/utils\"\n\n/**\n * Marks anything the AI wrote. Five dots; the centre one is the signal colour.\n * `thinking`: the dots pulse in turn while the AI is reading sources.\n */\nexport interface AiSparkProps {\n  thinking?: boolean\n  className?: string\n}\n\nconst DOTS: [number, number][] = [[7, 2.3], [11.7, 7], [7, 11.7], [2.3, 7]]\n\nexport function AiSpark({ thinking = false, className }: AiSparkProps) {\n  return (\n    <svg data-slot=\"ai-spark\" viewBox=\"0 0 14 14\" aria-hidden=\"true\" className={cn(\"size-3.5 shrink-0\", className)}>\n      {DOTS.map(([cx, cy], i) => (\n        <circle\n          key={i}\n          cx={cx}\n          cy={cy}\n          r={1.5}\n          className={cn(\"fill-foreground\", thinking && \"animate-pulse motion-reduce:animate-none\")}\n          style={thinking ? { animationDelay: `${i * 150}ms` } : undefined}\n        />\n      ))}\n      <circle cx={7} cy={7} r={1.5} className=\"fill-signal\" />\n    <\/svg>\n  )\n}\n", "evidence-card": "import { cn } from \"@/lib/utils\"\n\n/**\n * One source the AI read, opened from its evidence chip.\n * The bar shows today's reading against the normal range; the tick is the 30-day baseline.\n */\nexport interface EvidenceCardProps {\n  n: number\n  source: string\n  value: string\n  unit?: string\n  /** Today's reading, 0–1 of the bar. */\n  now: number\n  /** The normal range, 0–1 of the bar. */\n  normal?: [number, number]\n  /** The 30-day baseline, 0–1 of the bar. */\n  baseline?: number\n  caption: string\n  /** Its chip or drawing mark is hovered elsewhere. */\n  linked?: boolean\n  /** Reading is older than 15 minutes. */\n  stale?: boolean\n  age?: string\n  className?: string\n}\n\nexport function EvidenceCard({ n, source, value, unit, now, normal = [0, 0.62], baseline = 0.62, caption, linked = false, stale = false, age = \"15 min\", className }: EvidenceCardProps) {\n  return (\n    <div\n      data-slot=\"evidence-card\"\n      className={cn(\n        \"grid gap-2 bg-[var(--gc-glass-raised)] p-4 shadow-[inset_0_1px_0_var(--gc-edge-hi)] transition-shadow duration-200 ease-gc\",\n        linked && \"shadow-[inset_0_0_0_1.5px_var(--gc-accent)]\",\n        stale && \"opacity-60\",\n        className\n      )}\n    >\n      <div className=\"flex items-baseline justify-between gap-3\">\n        <span className=\"font-mono text-[11px] uppercase tracking-[0.05em] text-muted-foreground\">{n} · {source}<\/span>\n        {stale && <span className=\"font-mono text-xs text-muted-foreground\">{age} ago<\/span>}\n      <\/div>\n      <div className=\"flex items-baseline gap-2\">\n        <span className=\"text-xl font-medium\">{value}<\/span>\n        {unit && <span className=\"text-[13px] text-muted-foreground\">{unit}<\/span>}\n      <\/div>\n      <div className=\"relative h-1.5 bg-border\">\n        <i className=\"absolute inset-y-0 bg-muted-foreground/30\" style={{ left: `${normal[0] * 100}%`, width: `${(normal[1] - normal[0]) * 100}%` }} />\n        <i className=\"absolute inset-y-0 left-0 bg-signal\" style={{ width: `${now * 100}%` }} />\n        <i className=\"absolute -inset-y-1 w-px bg-foreground\" style={{ left: `${baseline * 100}%` }} />\n      <\/div>\n      <span className=\"text-[13px] text-muted-foreground\">{caption}<\/span>\n    <\/div>\n  )\n}\n", "toast": "import * as React from \"react\"\nimport { cn } from \"@/lib/utils\"\nimport { Spinner } from \"@/components/ui/spinner\"\n\n/**\n * Shown after anything the AI applied. Stays 6 s, pauses while hovered, and always offers Undo.\n */\nexport interface UndoToastProps {\n  message: string\n  onUndo: () => Promise<void> | void\n  onClose?: () => void\n  /** How long it stays, in ms. */\n  duration?: number\n  className?: string\n}\n\nexport function UndoToast({ message, onUndo, onClose, duration = 6000, className }: UndoToastProps) {\n  const [state, setState] = React.useState<\"running\" | \"paused\" | \"undoing\" | \"undone\">(\"running\")\n  const left = React.useRef(duration)\n  const started = React.useRef(Date.now())\n\n  React.useEffect(() => {\n    if (state !== \"running\") return\n    started.current = Date.now()\n    const t = setTimeout(() => onClose?.(), left.current)\n    return () => {\n      clearTimeout(t)\n      left.current -= Date.now() - started.current\n    }\n  }, [state, onClose])\n\n  React.useEffect(() => {\n    if (state !== \"undone\") return\n    const t = setTimeout(() => onClose?.(), 2000)\n    return () => clearTimeout(t)\n  }, [state, onClose])\n\n  async function undo() {\n    setState(\"undoing\")\n    await onUndo()\n    setState(\"undone\")\n  }\n\n  return (\n    <div\n      data-slot=\"toast\"\n      role=\"status\"\n      onMouseEnter={() => state === \"running\" && setState(\"paused\")}\n      onMouseLeave={() => state === \"paused\" && setState(\"running\")}\n      className={cn(\n        \"relative inline-flex h-10 items-center gap-2.5 overflow-hidden bg-[var(--gc-glass)] px-3.5 text-sm shadow-[inset_0_1px_0_var(--gc-edge-hi),var(--gc-drop)] backdrop-blur-[24px]\",\n        className\n      )}\n    >\n      {state === \"undoing\" ? <Spinner /> : (\n        <svg viewBox=\"0 0 14 14\" className=\"size-3.5 fill-none stroke-current stroke-[1.5]\" aria-hidden=\"true\"><path d={state === \"undone\" ? \"M4 4h6v6M10 4 4 10\" : \"M2.5 7.3 5.5 10 11.5 4\"} /><\/svg>\n      )}\n      <span>{state === \"undoing\" ? \"Undoing…\" : state === \"undone\" ? \"Undone\" : message}<\/span>\n      {(state === \"running\" || state === \"paused\") && (\n        <>\n          <span className=\"h-4 w-px bg-border\" />\n          <button type=\"button\" onClick={undo} className=\"text-muted-foreground underline underline-offset-[3px] hover:text-foreground\">Undo<\/button>\n          <i\n            className=\"absolute bottom-0 left-0 h-px w-full origin-left bg-foreground/40\"\n            style={{ animation: `gc-toast ${duration}ms linear forwards`, animationPlayState: state === \"paused\" ? \"paused\" : \"running\" }}\n          />\n          <style>{\"@keyframes gc-toast{from{transform:scaleX(1)}to{transform:scaleX(0)}}\"}<\/style>\n        <\/>\n      )}\n    <\/div>\n  )\n}\n", "action-row": "import { cn } from \"@/lib/utils\"\n\n/**\n * One action in a plan, with its live status and a thin progress bar.\n * `failed` always says why, in the signal colour.\n */\nexport type ActionStatus = \"planned\" | \"running\" | \"done\" | \"undone\" | \"failed\"\n\nexport interface ActionRowProps {\n  label: string\n  status: ActionStatus\n  /** 0–100, used while running. */\n  progress?: number\n  /** Time shown for planned, done and undone, e.g. \"Sat 08:00\". */\n  time?: string\n  /** Required when failed. */\n  reason?: string\n  className?: string\n}\n\nexport function ActionRow({ label, status, progress = 0, time, reason, className }: ActionRowProps) {\n  const p = status === \"done\" ? 100 : status === \"running\" ? progress : status === \"failed\" ? Math.max(progress, 25) : 0\n  const right = status === \"running\" ? `${progress}%` : status === \"failed\" ? \"Needs you\" : status === \"done\" ? `Done ${time ?? \"\"}` : status === \"undone\" ? \"Undone\" : time\n  return (\n    <div data-slot=\"action-row\" data-status={status} className={cn(\"grid grid-cols-[minmax(0,1fr)_auto] items-center gap-x-3 gap-y-2 p-3 shadow-[inset_0_0_0_1px_var(--border)]\", className)}>\n      <span className={cn(\"truncate text-[13px]\", status === \"undone\" && \"text-muted-foreground line-through\")}>{label}<\/span>\n      <span className={cn(\"whitespace-nowrap font-mono text-xs text-muted-foreground\", status === \"failed\" && \"text-signal\")}>{right}<\/span>\n      {status !== \"planned\" && status !== \"undone\" && (\n        <span className=\"col-span-2 h-1 bg-border\">\n          <i className={cn(\"block h-full transition-[width] duration-300 ease-gc\", status === \"running\" ? \"bg-signal\" : \"bg-muted-foreground\")} style={{ width: `${p}%` }} />\n        <\/span>\n      )}\n      {status === \"failed\" && reason && <span className=\"col-span-2 text-[13px] text-signal\">{reason}<\/span>}\n    <\/div>\n  )\n}\n", "owner-row": "import { cn } from \"@/lib/utils\"\nimport { Button } from \"@/components/ui/button\"\nimport { ObjectLink } from \"@/components/ui/object-link\"\n\n/**\n * Who should act. The AI suggests a team and the person on shift; a person confirms with Assign.\n */\nexport interface OwnerRowProps {\n  team: string\n  teamHref: string\n  person: string\n  personHref: string\n  state?: \"suggested\" | \"assigning\" | \"assigned\"\n  onAssign?: () => void\n  onUndo?: () => void\n  className?: string\n}\n\nexport function OwnerRow({ team, teamHref, person, personHref, state = \"suggested\", onAssign, onUndo, className }: OwnerRowProps) {\n  return (\n    <div data-slot=\"owner-row\" data-state={state} className={cn(\"flex flex-wrap items-center gap-x-2.5 gap-y-2 text-[13px]\", className)}>\n      <span className=\"font-mono text-[11px] uppercase tracking-[0.05em] text-muted-foreground\">Owner<\/span>\n      <ObjectLink href={teamHref}>{team}<\/ObjectLink>\n      <span className=\"text-muted-foreground\">on shift<\/span>\n      <ObjectLink href={personHref}>{person}<\/ObjectLink>\n      <span className=\"ml-auto\">\n        {state === \"assigned\" ? (\n          <span className=\"inline-flex items-center gap-2 text-muted-foreground\">\n            Assigned\n            {onUndo && <button type=\"button\" onClick={onUndo} className=\"underline underline-offset-[3px] hover:text-foreground\">Undo<\/button>}\n          <\/span>\n        ) : (\n          <Button size=\"sm\" variant=\"secondary\" loading={state === \"assigning\"} onClick={onAssign}>{state === \"assigning\" ? \"Assigning…\" : \"Assign\"}<\/Button>\n        )}\n      <\/span>\n    <\/div>\n  )\n}\n", "alert-card": "import { cn } from \"@/lib/utils\"\nimport { Button } from \"@/components/ui/button\"\nimport { ObjectLink } from \"@/components/ui/object-link\"\nimport { StateTag } from \"@/components/ui/state-tag\"\n\n/**\n * The first thing a person sees about a problem: where, what, what it costs, one action.\n * `new` carries a signal-colour edge until it is opened.\n */\nexport interface AlertCardProps {\n  /** e.g. \"Cooling · issue\" */\n  area: string\n  /** Shown top right while open, e.g. \"+14% power\". */\n  delta?: string\n  object: string\n  objectHref: string\n  /** The rest of the headline after the object name. */\n  headline: string\n  /** One line in money or time, e.g. \"About ¥250 a day above normal\". */\n  cost: string\n  state?: \"new\" | \"open\" | \"investigating\" | \"resolved\"\n  onInvestigate?: () => void\n  className?: string\n}\n\nexport function AlertCard({ area, delta, object, objectHref, headline, cost, state = \"new\", onInvestigate, className }: AlertCardProps) {\n  const done = state === \"resolved\"\n  return (\n    <article\n      data-slot=\"alert-card\"\n      data-state={state}\n      className={cn(\n        \"grid gap-2.5 bg-[var(--gc-glass)] px-5 py-[18px] shadow-[inset_0_1px_0_var(--gc-edge-hi),var(--gc-drop)] backdrop-blur-[24px] transition-[box-shadow,opacity] duration-300 ease-gc\",\n        state === \"new\" && \"shadow-[inset_3px_0_0_var(--gc-accent),inset_0_1px_0_var(--gc-edge-hi),var(--gc-drop)]\",\n        done && \"opacity-70\",\n        className\n      )}\n    >\n      <div className=\"flex items-center gap-3\">\n        <span className=\"font-mono text-[11px] uppercase tracking-[0.05em] text-muted-foreground\">{area}<\/span>\n        <span className=\"ml-auto\">\n          {state === \"investigating\" ? <StateTag state=\"investigating\" /> : done ? <StateTag state=\"resolved\" /> : delta ? <StateTag state=\"issue\">{delta}<\/StateTag> : null}\n        <\/span>\n      <\/div>\n      <h3 className=\"m-0 text-lg font-normal leading-[25px]\">\n        <ObjectLink href={objectHref}>{object}<\/ObjectLink> {headline}\n      <\/h3>\n      <span className=\"text-[13px] text-muted-foreground\">{cost}<\/span>\n      {(state === \"new\" || state === \"open\") && (\n        <div className=\"mt-1.5 border-t border-border pt-3.5\">\n          <Button onClick={onInvestigate}>Investigate<\/Button>\n        <\/div>\n      )}\n    <\/article>\n  )\n}\n", "plan-rail": "import { cn } from \"@/lib/utils\"\nimport { Button } from \"@/components/ui/button\"\nimport { Spinner } from \"@/components/ui/spinner\"\n\n/**\n * The AI's plan as numbered steps on one rail. Only the current step can be applied.\n * `draft` (confidence 50–79) asks for a review before Apply.\n */\nexport type StepState = \"upcoming\" | \"current\" | \"draft\" | \"applying\" | \"done\" | \"failed\"\n\nexport interface PlanStep {\n  when: string\n  title: React.ReactNode\n  state: StepState\n  /** Required when failed. */\n  reason?: string\n}\n\nexport interface PlanRailProps {\n  steps: PlanStep[]\n  onApply?: (index: number) => void\n  onReview?: (index: number) => void\n  className?: string\n}\n\nexport function PlanRail({ steps, onApply, onReview, className }: PlanRailProps) {\n  return (\n    <ol data-slot=\"plan-rail\" className={cn(\"m-0 grid list-none p-0\", className)}>\n      {steps.map((s, i) => {\n        const live = s.state === \"current\" || s.state === \"draft\" || s.state === \"applying\"\n        return (\n          <li key={i} data-state={s.state} className=\"relative grid grid-cols-[22px_1fr] gap-3 pb-5 last:pb-0\">\n            {i < steps.length - 1 && <span className=\"absolute top-[26px] bottom-1 left-[10.5px] w-px bg-border\" />}\n            <span\n              className={cn(\n                \"grid size-[22px] place-items-center font-mono text-[11px] shadow-[inset_0_0_0_1px_var(--border)]\",\n                live && \"bg-signal text-on-signal shadow-none\",\n                s.state === \"done\" && \"bg-foreground text-background shadow-none\",\n                s.state === \"failed\" && \"text-signal shadow-[inset_0_0_0_1.5px_var(--gc-accent)]\"\n              )}\n            >\n              {s.state === \"done\" ? \"✓\" : i + 1}\n            <\/span>\n            <div className=\"grid gap-1\">\n              <span className={cn(\"text-[13px]\", live ? \"text-signal\" : \"text-muted-foreground\")}>{s.state === \"draft\" ? `${s.when} · Draft` : s.when}<\/span>\n              <span className={cn(s.state === \"done\" && \"text-muted-foreground\")}>{s.title}<\/span>\n              {s.state === \"failed\" && s.reason && <span className=\"text-[13px] text-signal\">{s.reason}<\/span>}\n              {live && (\n                <div className=\"mt-1.5 flex items-center gap-3\">\n                  {s.state === \"draft\" ? (\n                    <Button variant=\"secondary\" size=\"sm\" onClick={() => onReview?.(i)}>Review first<\/Button>\n                  ) : (\n                    <Button size=\"sm\" loading={s.state === \"applying\"} onClick={() => onApply?.(i)}>{s.state === \"applying\" ? \"Applying…\" : \"Apply\"}<\/Button>\n                  )}\n                  {s.state === \"applying\" ? <Spinner className=\"hidden\" /> : <span className=\"text-[13px] text-muted-foreground\">You can undo anytime<\/span>}\n                <\/div>\n              )}\n            <\/div>\n          <\/li>\n        )\n      })}\n    <\/ol>\n  )\n}\n", "causes-check": "import { cn } from \"@/lib/utils\"\nimport { Button } from \"@/components/ui/button\"\nimport { CONFIDENCE_REVIEW } from \"@/components/ui/confidence-meter\"\n\n/**\n * When the AI is not sure: the possible causes and one check that tells them apart.\n * Below 50% every cause reads \"possible\" and no fix is offered.\n * In the draft band (50–79) the leading cause reads \"likely\"; the others \"maybe\".\n */\nexport interface CausesCheckProps {\n  confidence: number\n  /** Ordered most to least likely. */\n  causes: string[]\n  check: string\n  onAssign?: () => void\n  onKeepWatching?: () => void\n  className?: string\n}\n\nexport function CausesCheck({ confidence, causes, check, onAssign, onKeepWatching, className }: CausesCheckProps) {\n  const low = confidence < CONFIDENCE_REVIEW\n  const label = (i: number) => (low ? \"possible\" : i === 0 ? \"likely\" : \"maybe\")\n  return (\n    <div data-slot=\"causes-check\" className={cn(\"grid gap-3.5 bg-[var(--gc-glass-raised)] p-4 shadow-[inset_0_1px_0_var(--gc-edge-hi)]\", className)}>\n      <span className=\"font-mono text-[11px] uppercase tracking-[0.05em] text-muted-foreground\">What it could be · {confidence}%<\/span>\n      <ul className=\"m-0 grid list-none gap-0 p-0\">\n        {causes.map((c, i) => (\n          <li key={c} className=\"flex items-baseline justify-between gap-3 border-b border-border py-2 text-[13px] last:border-0\">\n            <span className=\"min-w-0 truncate\">{c}<\/span>\n            <span className={cn(\"shrink-0 font-mono text-[11px] uppercase tracking-[0.05em]\", !low && i === 0 ? \"text-signal\" : \"text-muted-foreground\")}>{label(i)}<\/span>\n          <\/li>\n        ))}\n      <\/ul>\n      <div className=\"grid gap-1\">\n        <span className=\"font-mono text-[11px] uppercase tracking-[0.05em] text-muted-foreground\">Suggested check<\/span>\n        <span className=\"text-[13px]\">{check}<\/span>\n        {low && <span className=\"text-[13px] text-muted-foreground\">Not sure enough to suggest a fix yet.<\/span>}\n      <\/div>\n      <div className=\"flex flex-wrap gap-2\">\n        <Button size=\"sm\" onClick={onAssign}>Assign a check<\/Button>\n        <Button size=\"sm\" variant=\"secondary\" onClick={onKeepWatching}>Keep watching<\/Button>\n      <\/div>\n    <\/div>\n  )\n}\n"}; window.GC_SKILLS = {"gc-a11y": "---\nname: gc-a11y\ndescription: Use when building or reviewing any Green Control component, so it works by keyboard, reads clearly in both themes, and makes sense to a screen reader.\n---\n\n# Make a component accessible\n\nPeople run plants at night, on shared screens, sometimes by keyboard only. Every component must work for them.\n\n## Keyboard\n\n- Everything clickable is reachable with Tab, in reading order, and works with Enter or Space.\n- Focus ring on every focusable element: 1.5px in the text colour, 2px outside. Never remove it.\n- Segmented control and tabs: arrow keys move between options.\n- Esc closes anything that opened (peek, toast, sheet).\n\n## Contrast (both themes)\n\n- Text 4.5:1 against what it sits on, including muted text on raised and chip backgrounds.\n- Meters, dots and glyphs 3:1.\n- Never colour alone: an issue has a triangle and a word, not just orange.\n\n## Screen readers\n\n- Buttons have a label, even icon-only ones (`aria-label=\"Send\"`).\n- Segmented options use `aria-pressed`; the group has `aria-label`.\n- The confidence meter is `role=\"meter\"` with `aria-valuenow`.\n- Loading sets `aria-busy`; the toast is `role=\"status\"` so its message is read.\n- Object links say what they open (\"Chiller 2\"), not \"click here\".\n\n## Motion\n\nRespect `prefers-reduced-motion` (see `gc-motion`).\n\n## Check\n\nRun `python3 tools/gc_check.py` (contrast, focus rings, unlabeled buttons). Then tab through the component once with the mouse unplugged.\n", "gc-break-ui": "---\nname: gc-break-ui\ndescription: Use to stress-test a Green Control component or screen with the worst real data (long names, many evidence cards, missing readings, confidence right at 49/50/79/80) before it ships.\n---\n\n# Try to break it\n\nBuilding data is messy. Feed the component the worst real cases and fix what breaks.\n\n## Test cases\n\n**Names and text**\n- The longest machine name: \"Centrifugal chiller CH-02 (north plant, condenser loop B)\".\n- Chinese and English side by side; a Chinese title one character over the line.\n- A person name with 4 words; a work order like WO-2026-118204.\n\n**Numbers**\n- 0, negative, and very large values (−3.2%, 12,480 kW, ¥1,250,000).\n- Confidence exactly at the lines: 49, 50, 79, 80. Each must land in the right band (`gc-confidence`).\n\n**Amounts**\n- 1 evidence card and 4 evidence cards. 0 causes, 1 cause, 5 causes.\n- A plan with 1 step and with 7 steps.\n\n**Missing or slow**\n- A reading that never arrived; a reading 3 hours old (stale).\n- Sending that takes 10 s; sending that fails.\n\n**Settings**\n- Night and day. Reduced motion on. 200% text size. A 375 px wide screen.\n\n## What counts as broken\n\nText overflows or is cut without an ellipsis · the layout jumps between states · a value lands in the wrong band · the one accent appears twice · something can't be read at 4.5:1 · a state has no way back.\n\n## Output\n\n```\nAlert card · 4 breaks\n1. 80-character machine name pushes the delta tag off the card → truncate the name, keep the tag.\n2. Confidence 50 shows \"check\" → band boundary uses > instead of >=.\n```\n", "gc-motion": "---\nname: gc-motion\ndescription: Use when adding or fixing motion on any Green Control component (buttons, segmented control, alert card, toast, meters, plan rail), so every movement uses the system's one curve, feels physical and respects reduced motion.\n---\n\n# Animate a Green Control component\n\nMotion here has one job: show what changed, so a person on shift never misses it. It is never decoration.\n\n## The tokens\n\n- One curve for everything that moves: `--ease` = `cubic-bezier(0.2, 0, 0, 1)`.\n- One spring, only for things that arrive or come back from a press: `--spring` = `cubic-bezier(0.34, 1.56, 0.64, 1)`.\n- Durations: press 80 ms · colour 160 ms · move and resize 300 ms · arrive 420–520 ms. Nothing longer except live progress.\n\n## Recipes\n\n| Component | Motion |\n|---|---|\n| Button | Scale 0.97 on pointer-down, 80 ms ease-out. Release springs back over 260 ms. Loading keeps its width. |\n| Segmented control | The selection slides to the new option (transform + width, 300 ms). It never jumps. |\n| Object link | The dot grows to 1.4× with the spring on hover; the underline thickens. |\n| Evidence chip | The number pops in (scale 0.4 → 1, spring) when a check lands. Hover lifts 1 px. |\n| Confidence meter | Segments fill left to right, 16 ms apart. |\n| Alert card | New: the accent edge grows top to bottom once. Hover lifts 2 px with a deeper shadow. |\n| Toast | Rises 10 px, scale 0.97 → 1, blur 4 → 0 px. A 1 px line counts down 6 s and pauses on hover. |\n| Action row | Running: the bar's sheen flows; width changes ease over 500 ms. |\n| Ask input | Error: one short shake (360 ms), then still. |\n| AI spark | Thinking: dots pulse in turn. |\n\n## Never\n\n- Animate layout properties (top, left, height). Use transform and opacity.\n- Loop slower than 1 s, except live progress.\n- Animate on every data update; the figure assembles once per figure.\n- Bounce something the person didn't throw.\n\n## Reduced motion\n\nUnder `prefers-reduced-motion: reduce`: no movement, no springs, no loops. Keep colour and opacity changes that explain state.\n\n## Done when\n\nEvery state change on the component is visible, uses the tokens above, and works with reduced motion on.\n", "gc-responsive": "---\nname: gc-responsive\ndescription: Use when a Green Control component or screen must work from a 375px phone to a 1440px control-room display, to decide what wraps, what truncates, what stacks and what hides.\n---\n\n# Fit every width\n\nThe same alert is read on a control-room wall and on a technician's phone. Decide how each part behaves, don't leave it to the browser.\n\n## Widths to check\n\n375 (phone) · 768 (tablet) · 1180 (laptop) · 1440 (desk).\n\n## Rules\n\n- **Names truncate, numbers never do.** A machine name gets an ellipsis; a value, unit or confidence always shows in full.\n- **Tags stay on one line.** State tags and statuses don't wrap; shorten the word instead (\"60%\" not \"Running · 60%\").\n- **Rows stack below 720px.** Label above value; actions drop to their own line, left-aligned.\n- **Touch targets 44px** on phone widths, even if the button looks smaller.\n- **The AI panel** (400px) becomes a bottom sheet below 1024px; the drawing stays on top.\n- **Evidence row** goes from a row of cards to a vertical list below 720px; numbers stay.\n- **Never hide** the one action (Apply, Assign) or the confidence. Hide decoration first: dot field, captions.\n\n## Check\n\nOpen each width. Nothing overflows, nothing important is cut, the accent still marks only one thing.\n", "gc-states": "---\nname: gc-states\ndescription: Use when building or reviewing a Green Control component, to list and draw every state it can be in, so nothing is left for the AI or the engineer to guess.\n---\n\n# Draw every state\n\nA state you don't draw gets drawn differently every time. List them all, then draw them all.\n\n## Step 1 · List the states in three groups\n\n1. **Things a person does:** default, hover, focus (keyboard), pressed, disabled.\n2. **Things the system does:** loading or sending, success, error (says why and how to recover), empty, stale (old data).\n3. **Things the AI decides:** the three confidence bands (check below 50, draft 50–79, plan 80+), checking vs landed, linked (hovered elsewhere).\n\nNot every component has all of them. Cross out the ones that can't happen and say why.\n\n## Step 2 · Draw each one\n\n- Same size and content in every state, so only the state changes.\n- Night and day.\n- Long content too: the longest machine name, two-line titles (see `gc-break-ui`).\n\n## Step 3 · Write each state down\n\nFor every state: its name, one line on when it happens, and how it is set in code (a prop like `status=\"failed\"`, or \"happens by itself\" for hover, focus and pressed).\n\n## Green Control examples\n\n| Component | States |\n|---|---|\n| Button | default · hover · focus · pressed · loading · disabled |\n| Action row | planned · running · done · undone · failed (always with a reason) |\n| Owner row | suggested · assigning · assigned (with Undo) |\n| Causes & check | below 50 (all \"possible\") · draft (first \"likely\") |\n\n## Done when\n\nEvery state in the list is drawn in both themes, and each has one line saying when it happens.\n", "green-control": "---\nname: green-control\ndescription: Use whenever you create or change a Green Control (AI GC) screen or AI flow. One skill for the whole loop: decide what the AI may do, choose the evidence, build the screen, draw the machine, write the AI's words, review, and turn feedback into rules.\n---\n\n# Green Control\n\nThe one idea: **evidence first, people decide.** The AI may look, compare and suggest. Anything that changes a machine waits for a person, shows why, and can be undone.\n\nRead `DESIGN.md` and `tokens.json` first: https://shuyii0315-arch.github.io/green-control/system/files/\n\nWork through the steps in order. Steps 1, 2, 5, 6 and 7 are judgement calls; write down what you decided before you build.\n\nFor component details (motion, states, edge cases, accessibility, widths) use the component skills: `gc-motion`, `gc-states`, `gc-break-ui`, `gc-a11y`, `gc-responsive`.\n\n\n## 1 · Decide what the AI may do\n\nGreen Control's first rule is *evidence first, people decide*. How far the AI may go depends on how sure it is. Make this call before any layout or wording.\n\n### The bands\n\n| Confidence | Band | The AI may | The screen shows |\n|---|---|---|---|\n| 80 and up | plan | propose a plan | plan rail + Apply |\n| 50–79 | draft | draft a plan | \"Draft\" label, evidence open, Review before Apply |\n| below 50 | check | only suggest a check | no plan; competing causes + one suggested check + Assign |\n\nThresholds live in `tokens.json` as `ai.confidence.act` (80) and `ai.confidence.review` (50). Read them; never hard-code.\n\n### How to decide\n\n1. Find the number. If the brief gives none, ask for it. Never pick one to make a screen look better.\n2. Map it to a band with the table.\n3. List competing causes whenever more than one is still possible, in the draft band as well as below 50. The leading cause carries the confidence; the others read \"maybe\" (draft) or all read \"possible\" (below 50).\n4. Below 50, write the one check that would tell the causes apart. It is the suggestion, not an evidence card.\n5. In every band: Apply needs a person's tap, and every applied step can be undone.\n\n### Output\n\nWrite down the band, the reason, and what the screen must and must not show, before building:\n\n```\nBand: check (41%)\nWhy: the data fits three causes equally\nShow: causes list (all \"possible\"), suggested check, Assign\nDo not show: any fix, Apply, a plan rail\n```\n\n### Examples\n\n- \"The AI is 41% sure the door is slow because of debris. What do we show?\" → check band, three causes, suggest one site visit.\n- \"88% sure charging BT-01 tonight avoids the peak.\" → plan band, plan + Apply + Undo.\n\n\n## 2 · Choose the evidence\n\nPeople decide only if they can see why. Evidence comes before any plan, and it follows the question a person would ask next, not a template.\n\n### Rules\n\n- One card per source the AI actually checked: 1 to 4. Never pad to three; never drop a real check to fit.\n- Number cards in the order the AI checked them. The same number appears on the evidence chip, the card, and the mark on the drawing; hovering one highlights all three.\n- Each card's tag is the next question about this topic, in plain words.\n- A single reading is one card, no row.\n\n### Question patterns\n\n| Situation | Card tags, in order |\n|---|---|\n| Fault | What's wrong → Where → Why |\n| Opportunity (a saving) | What's coming → What we have → Does it fit (→ What else needs it, if checked) |\n| Unsure (below 50%) | What we see → What it could be |\n\nSkip a step when no separate check answered it (for example, no Where if nothing located the fault).\n\n### Each card holds\n\nNumber and source · the value with its unit · a bar against the normal range with the 30-day baseline tick · one caption line (when, compared with what). Old readings (over 15 min) are marked stale, never hidden.\n\n### Example\n\n\"Why does the AI think Chiller 2 is the problem?\" →\n1 What's wrong: power +14% vs 30-day · 2 Where: Chiller 2, compressor · 3 Why: tubes 41 days past cleaning.\n\n\n## 3 · Build the screen\n\nRead `DESIGN.md` and `tokens.json` first: https://shuyii0315-arch.github.io/green-control/system/files/DESIGN.md · https://shuyii0315-arch.github.io/green-control/system/files/tokens.json\n\n### Start\n\n1. Decide the band with `gc-confidence` and the evidence with `gc-evidence`. Layout comes after.\n2. Copy `shell.html` (https://shuyii0315-arch.github.io/green-control/system/files/shell.html) and keep its frame: rail (64px) · stage with the figure and the evidence row · frosted AI panel (400px) on the right.\n3. Use the components. In React: `npx shadcn@latest add https://shuyii0315-arch.github.io/green-control/system/r/<name>.json` (registry: https://shuyii0315-arch.github.io/green-control/system/r/registry.json). In plain HTML: `green-control-components.css`.\n\n### Always\n\n- Only tokens, through CSS variables. No new colours, sizes, radii or shadows.\n- Both themes: set `data-gc=\"night\"` or `\"day\"` on the root and check both.\n- Calm by default: the screen is greys and the drawing. One accent per screen, only for the problem or the one action to take.\n- Square corners. Round only for status dots and spinners.\n- Sans for sentences; mono 11px uppercase for labels, data and time.\n- Reuse a component before making one. If none fits, stop and ask the designer.\n- The spark appears only where the AI speaks or acts.\n- Every applied step: a toast with Undo, and a row on the Actions timeline.\n\n\n## 4 · Draw the machine\n\nGreen Control never shows a machine as a table or an icon. Every equipment screen is built around a drawing of the real machine.\n\n### The drawing\n\n- Isometric line art, made with the **anatomy-figure** skill. Night render: dark, transparent background. Also a day render.\n- Research the real machine first and draw it as it is (where the motor, door, cells or pipes really sit).\n- View: 62° azimuth, standard isometric elevation. One batch of drawings shares one scale.\n- **Exactly one part is lit, in the accent: the part with the problem.** Everything else stays grey. The lit part needs enough detail to be recognised on its own.\n- Outlines bright enough to read at small sizes.\n\n### On the drawing\n\n- `.alab` glass labels (key + value, mono); `.hot` only on the problem.\n- Numbered `.amark`s where each piece of evidence was read; numbers match the evidence chips and cards (see `gc-evidence`).\n- Caption bottom-right in mono: `Fig. 02 — Chiller plant, iso 62°`.\n\n### Around it\n\n- Dot field behind the figure (0.55px dots, 4.2px pitch), fading before the edges; never behind text.\n- A soft pool of light under the object in focus.\n- When a screen opens on a new figure, it assembles once from its own points (`gc-assemble.js`). Never on every update; off under reduced motion.\n\n### Check before using\n\nReal structure? One part lit? Same scale as the rest of the batch? Readable small? If unsure, put it on the review desk (`gc-learn-rule`).\n\n\n## 5 · Write what the AI says\n\nThe AI talks like a colleague reporting to the person on shift: not a chatbot, not a salesperson.\n\n### Shape\n\n**Seen → means → do.** What was measured, what it probably means, the one next step. In that order.\nHeadline 12 words or fewer. Body two sentences or fewer. Everything else belongs in the evidence.\n\n### Words follow the band (see gc-confidence)\n\n| Band | Sounds like | Example |\n|---|---|---|\n| plan (80+) | Plain and direct: evidence, saving or risk, the plan. | \"Tomorrow 14:00–17:00 will pass the 3,100 kW limit by 250 kW. Charging BT-01 tonight covers it and saves ¥21,500.\" |\n| draft (50–79) | Likely cause and its number first, then what is not ruled out. | \"Most likely the CT-2 fan (58%): it draws 9% more power. Fouled fill isn't ruled out yet. Review the steps before applying.\" |\n| check (<50) | Says it can't tell, why, and the one check. Never sounds like a fix. | \"The data fits three causes equally, so I'm not suggesting a fix. One visit to the door covers all three.\" |\n\n### Always\n\n- Numbers and names, not adjectives: \"Door motor draws 18% more current since 06:10\", not \"abnormal behaviour\".\n- Equipment, teams and work orders are links.\n- \"I\" only for what the AI did (\"I compared door current with its 30-day baseline\").\n\n### Never\n\n\"I think / I feel / I believe\" · exclamation marks · \"Don't worry\" · \"Great news\" · \"smart\" · \"AI-powered\" · a hedge with no next step (\"might be worth looking into\").\n\n### Undo and mistakes\n\nOne line, own it, say the state now: \"Undid the BT-01 schedule. The battery is back to a 60% reserve.\"\n\n\n## 6 · Review: pass or block\n\nStrict. A screen passes only when every check below holds. Report each finding with where it is and why it matters.\n\n### 1. The five rules (block if any fails)\n\n1. **Evidence before advice:** at least one evidence chip appears before any plan.\n2. **People apply:** nothing changes a machine without a person's tap.\n3. **Everything is undoable:** each applied step has Undo in a toast and on the timeline.\n4. **Say less when unsure:** the plan's form and the words match the band (`gc-confidence`, `gc-ai-voice`). Below 50% there is no fix and no Apply.\n5. **Name the object:** equipment, teams and work orders are links.\n\n### 2. The look\n\n- Built around the drawing (`gc-draw-equipment`); one part lit.\n- Only tokens: no typed-in colour, size or radius.\n- One accent per screen, only for the problem or the one action.\n- Night and day both readable; text 4.5:1, graphics 3:1.\n- Focus ring on everything clickable; reduced motion turns animation off.\n- The spark only on AI content; the logo only top-left.\n\n### 3. The machine check\n\nRun `python3 tools/gc_check.py <folder>` (colours, contrast in both themes, focus rings, unlabeled buttons, token drift). 0 errors to pass. If it flags something you believe is right, say so; never hide it.\n\n### Output\n\n```\nVerdict: BLOCK\n1. Rule 4 · Elevator panel shows \"Apply fix\" at 41%. Below 50% only a check is allowed. → Replace with suggested check + Assign.\n2. Look · #ff7a00 typed in .badge. → Use var(--accent).\n```\n\n\n## 7 · Turn feedback into rules\n\nRules grow from real feedback, not from one person's guess. Sources: the review desk (results page → \"Copy all data\", JSON) and the corrections the designer made in the session.\n\n### Steps\n\n1. Collect every correction: grades marked okay or redo, the problems ticked, graders' notes, and edits the designer made by hand.\n2. Group them. The same problem on several drawings or screens is one rule.\n3. Write each rule as an instruction a future agent can follow, generalised to every similar case (\"Light one part only, never a whole assembly\", not \"fix the charger\").\n4. **Attach the reason.** Use the graders' or designer's own words. Never invent one: if nobody said why, propose a reason and mark it *to confirm*.\n5. Add where it came from: batch, how many people, which roles, which drawings.\n6. If a machine could catch it, propose a check for `gc_check.py` instead of a sentence.\n7. Write it into DESIGN.md and add a Changelog line. Remove rules that are now covered by a newer one.\n\n### Format\n\n```\n### Give the lit part enough detail to be recognised on its own.\n- Why: \"Part unclear\" ticked 5 times, on the EV fast charger (design 2, engineering 2, product 1).\n- In their words: \"The whole charger is orange; I can't tell which cable is broken.\"\n- Source: review desk · batch-1\n```\n\n### Then\n\nRedraw or rebuild what was graded redo, using the new rule, and send it back to the desk for the next round.\n"};</script>
