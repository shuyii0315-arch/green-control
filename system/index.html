<!DOCTYPE html>
<html lang="en" data-gc="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Control Design System</title>
<style>
@font-face { font-family: "Hanken Grotesk"; font-weight: 300; font-display: swap; src: url("fonts/hanken-grotesk-latin-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Hanken Grotesk"; font-weight: 400; font-display: swap; src: url("fonts/hanken-grotesk-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Hanken Grotesk"; font-weight: 500; font-display: swap; src: url("fonts/hanken-grotesk-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "DM Mono"; font-weight: 400; font-display: swap; src: url("fonts/dm-mono-latin-400-normal.woff2") format("woff2"); }

:root, [data-gc="night"] {
  --bg-page: #111214; --bg-surface: #1b1c1f; --bg-raised: #2b2d30; --bg-chip: #292a2e;
  --line: #33363b; --text: #ededed; --muted: #8f949c; --accent: #ff6b1a; --on-accent: #111214;
  --link: var(--text); --cta-bg: var(--text); --cta-fg: #111214; --sel-bg: var(--bg-raised); --sel-fg: var(--text); --badge-bg: var(--text);
  --glass: rgba(27, 28, 31, 0.78); --glass-raised: rgba(43, 45, 48, 0.85);
  --sheen: rgba(255, 255, 255, 0.02); --edge-hi: rgba(255, 255, 255, 0.035);
  --drop: 0 16px 40px rgba(0, 0, 0, 0.35);
  --dot: rgba(255, 255, 255, 0.22); --pool: rgba(255, 255, 255, 0.07);
  --grid: rgba(255, 255, 255, 0.045);
  --font-sans: "Hanken Grotesk", "PingFang SC", "Noto Sans SC", system-ui, sans-serif; --font-mono: "DM Mono", ui-monospace, "PingFang SC", "Noto Sans SC", monospace;
  --ease: cubic-bezier(0.2, 0, 0, 1); --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  color-scheme: dark;
}
[data-gc="day"] {
  --bg-page: #f1f1ef; --bg-surface: #fbfbfa; --bg-raised: #ececea; --bg-chip: #e4e4e1;
  --line: #dcdcd8; --text: #111111; --muted: #666662; --accent: #1f4fff; --on-accent: #ffffff;
  --link: var(--accent); --cta-bg: var(--accent); --cta-fg: #ffffff; --sel-bg: var(--accent); --sel-fg: #ffffff; --badge-bg: var(--accent);
  --glass: rgba(251, 251, 250, 0.82); --glass-raised: rgba(236, 236, 233, 0.92);
  --sheen: rgba(255, 255, 255, 0.25); --edge-hi: rgba(255, 255, 255, 0.5);
  --drop: 0 16px 40px rgba(17, 20, 30, 0.08);
  --dot: rgba(17, 24, 44, 0.32); --pool: rgba(26, 36, 64, 0.06);
  --grid: rgba(17, 24, 44, 0.05);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { background: var(--bg-page); }
body { margin: 0; background: var(--bg-page); color: var(--text); font-family: var(--font-sans); font-size: 16px; line-height: 25px; letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; transition: background 320ms var(--ease), color 320ms var(--ease); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 1.5px solid var(--text); outline-offset: 2px; }
a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 1px; }
h1, h2, h3, p { margin: 0; font-weight: inherit; }
h1, h2 { text-wrap: balance; }
img { display: block; max-width: 100%; }

.t-headline { font-size: 20px; line-height: 26px; letter-spacing: -0.01em; }
.t-strong { font-weight: 500; }
.t-small { font-size: 13px; line-height: 19px; }
.t-num { font-weight: 300; font-size: 34px; line-height: 38px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.t-label { font-family: var(--font-mono); font-size: 11px; line-height: 14px; letter-spacing: 0.05em; text-transform: uppercase; }
.t-data { font-family: var(--font-mono); font-size: 12px; line-height: 16px; }
.muted { color: var(--muted); }
.accent { color: var(--accent); }

.glass { background: linear-gradient(var(--sheen), transparent 60%), var(--glass); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: inset 0 1px 0 var(--edge-hi), var(--drop); }
.block { background: linear-gradient(var(--sheen), transparent 60%), var(--glass-raised); box-shadow: inset 0 1px 0 var(--edge-hi); }
.spark { width: 14px; height: 14px; flex: none; }
.spark circle { fill: var(--text); }
.spark circle.o { fill: var(--accent); }
.logo circle { fill: var(--text); }
.logo circle.o { fill: var(--accent); }
.logo circle.off { fill: var(--line); opacity: 0; }

/* ---------- frame: top bar, sidebar, page, toc ---------- */
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; height: 56px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
.brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; text-decoration: none; color: var(--text); }
.brand .logo { width: 22px; height: 22px; transition: transform 360ms var(--spring); }
.brand:hover .logo { transform: rotate(-8deg) scale(1.06); }
.brand .ver { padding: 1px 6px; box-shadow: inset 0 0 0 1px var(--line); }
.top .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.menu-btn { display: none; height: 32px; padding: 0 10px; box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; }
.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--line); }
.seg button { padding: 3px 10px; font-size: 13px; line-height: 18px; color: var(--muted); transition: background 200ms, color 200ms; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-fg); }

.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr) 200px; max-width: 1440px; margin: 0 auto; }
.side { position: sticky; top: 56px; align-self: start; height: calc(100vh - 56px); overflow: auto; padding: 24px 12px 40px 20px; border-right: 1px solid var(--line); scrollbar-width: thin; }
.side .grp { margin-top: 28px; }
.side .grp:first-child { margin-top: 0; }
.side .grp > .t-label { display: block; padding: 0 10px 6px; font-size: 10px; letter-spacing: 0.08em; color: color-mix(in srgb, var(--muted) 55%, var(--bg-page)); }
.side a { color: color-mix(in srgb, var(--text) 72%, var(--muted)); }
.side a { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; font-size: 14px; color: var(--muted); text-decoration: none; transition: color 160ms, background 160ms; }
.side a:hover { color: var(--text); }
.side a[aria-current="page"] { color: var(--text); background: var(--bg-surface); box-shadow: inset 2px 0 0 var(--accent); }
.side a .n { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }

.page { min-width: 0; padding: 40px 48px 96px; }
.page > * { max-width: 920px; }
.toc { position: sticky; top: 56px; align-self: start; padding: 40px 20px; }
.toc .t-label { display: block; margin-bottom: 10px; color: var(--muted); }
.toc a { display: block; padding: 4px 0 4px 10px; font-size: 13px; line-height: 18px; color: var(--muted); text-decoration: none; box-shadow: inset 1px 0 0 var(--line); }
.toc a:hover, .toc a.on { color: var(--text); box-shadow: inset 1px 0 0 var(--text); }

/* page head */
.ph { display: grid; gap: 14px; padding-bottom: 28px; }
.ph .crumb { color: var(--muted); }
.ph h1 { font-size: 44px; line-height: 48px; letter-spacing: -0.025em; font-weight: 300; }
.ph .lede { color: var(--muted); max-width: 64ch; font-size: 17px; line-height: 27px; }
.ph .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.page h2 { margin: 56px 0 6px; font-size: 24px; line-height: 30px; font-weight: 400; letter-spacing: -0.015em; scroll-margin-top: 80px; }
.page h2 + .sub { color: var(--muted); max-width: 64ch; margin-bottom: 20px; }
.page h3 { font-size: 16px; font-weight: 500; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 72px; }
.pager a { display: grid; gap: 4px; padding: 16px 18px; box-shadow: inset 0 0 0 1px var(--line); text-decoration: none; color: var(--text); transition: background 200ms; }
.pager a:hover { background: var(--bg-surface); }
.pager a.next { text-align: right; }

/* separators: a dashed guide with a mono index, like the prototype's zone lines */
.sec { display: flex; align-items: baseline; gap: 16px; margin: 112px 0 28px; padding-top: 24px; border-top: 1px solid var(--line); }
.sec .no { font: 13px/16px var(--font-mono); color: var(--accent); }
.page .sec h2 { margin: 0; font-size: 34px; line-height: 40px; font-weight: 300; letter-spacing: -0.02em; }
@media (max-width: 720px) { .sec { margin-top: 72px; } .page .sec h2 { font-size: 26px; line-height: 32px; } }

.cta { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; height: 34px; padding: 0 14px; background: var(--cta-bg); color: var(--cta-fg); font-weight: 500; font-size: 14px; text-decoration: none; transition: transform 140ms var(--ease), filter 200ms; }
.cta:active { transform: scale(0.96); }
.btn-ghost { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 12px; background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; text-decoration: none; color: var(--text); transition: background 200ms; }
.btn-ghost:hover { background: var(--bg-raised); }
.pbtn { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; white-space: nowrap; }
.pbtn.primary { background: var(--cta-bg); color: var(--cta-fg); box-shadow: none; }
.install { display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%; box-sizing: border-box; height: 40px; padding: 0 4px 0 14px; background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--line); }
.install code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }

/* generic layout helpers */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.tile { box-shadow: inset 0 0 0 1px var(--line); padding: 20px; display: grid; gap: 10px; align-content: start; }
.tile .t-label { color: var(--muted); }
.stage { position: relative; display: grid; place-items: center; padding: 32px 24px; box-shadow: inset 0 0 0 1px var(--line); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 14px 14px; overflow: hidden; }
.do-dont { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.dd { display: grid; gap: 10px; }
.dd .stage { min-height: 150px; }
.dd .verdict { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 19px; }
.dd .verdict i { width: 8px; height: 8px; display: block; flex: none; }
.dd.yes .verdict i { background: var(--text); }
.dd.no .verdict i { background: var(--accent); }
.dd.no .stage::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top right, transparent calc(50% - 0.5px), var(--accent) 50%, transparent calc(50% + 0.5px)); opacity: 0.6; pointer-events: none; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; }
.table th { text-align: left; font: 11px/14px var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 400; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.table td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table td.mono { font-family: var(--font-mono); font-size: 12px; }

/* particles: the dot field and the pool, as in the prototype */
.dots { position: absolute; inset: 0; background-image: radial-gradient(var(--dot) 0.55px, transparent 0.75px); background-size: 4.2px 4.2px; -webkit-mask-image: radial-gradient(ellipse 58% 62% at 50% 50%, #000 40%, transparent 100%); mask-image: radial-gradient(ellipse 58% 62% at 50% 50%, #000 40%, transparent 100%); pointer-events: none; }
.pool { position: absolute; left: 18%; top: 26%; width: 64%; height: 58%; background: radial-gradient(closest-side, var(--pool), transparent); pointer-events: none; }

/* ---------- overview hero ---------- */
.hero-fig { position: relative; margin-top: 8px; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; background: var(--bg-page); }
.hero-fig img { width: 100%; }
.hero-fig .cap { position: absolute; right: 14px; bottom: 10px; padding: 2px 6px; background: var(--glass); font: 10px/14px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.why { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
.why p + p { margin-top: 14px; }
.pillars { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.pillars > div { padding: 20px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; gap: 8px; align-content: start; }
.pillars .k { font: 10px/14px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); box-shadow: 0 0 0 1px var(--line); }
.cards a { display: grid; gap: 6px; padding: 18px; background: var(--bg-page); text-decoration: none; color: var(--text); transition: background 200ms; }
.cards a:hover { background: var(--bg-surface); }
.result-strip { display: grid; grid-template-columns: repeat(3, 1fr); box-shadow: inset 0 0 0 1px var(--line); }
.result-strip > div { padding: 18px 20px; display: grid; gap: 6px; }
.result-strip > div + div { box-shadow: inset 1px 0 0 var(--line); }

/* ---------- brand ---------- */
.mark-hero { position: relative; display: grid; grid-template-columns: 1fr 1fr; min-height: 380px; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.mark-hero > div { position: relative; display: grid; place-items: center; padding: 32px; }
.mark-hero > div + div { box-shadow: inset 1px 0 0 var(--line); }
.mark-hero .logo-big { width: 220px; height: 220px; }
.construct { width: 280px; height: 280px; }
.construct .cell { fill: none; stroke: var(--line); stroke-width: 0.15; }
.construct .ax { stroke: var(--muted); stroke-width: 0.12; stroke-dasharray: 0.6 0.6; }
.construct text { font: 1.1px var(--font-mono); fill: var(--muted); letter-spacing: 0.05px; }
.construct circle { transition: r 300ms var(--spring), fill 300ms; }
.construct circle.off { fill: none; stroke: var(--line); stroke-width: 0.12; }
.construct circle.on { fill: var(--text); }
.construct circle.o { fill: var(--accent); }
.lockups { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
.lockups .stage { min-height: 170px; }
.lock-h { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; }
.lock-h .logo { width: 34px; height: 34px; }
.appicon { width: 88px; height: 88px; display: grid; place-items: center; background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--line); }
.appicon .logo { width: 52px; height: 52px; }
.clear { position: relative; display: inline-flex; align-items: center; gap: 12px; padding: 14px; outline: 1px dashed var(--accent); outline-offset: 0; font-size: 22px; font-weight: 500; }
.clear .logo { width: 28px; height: 28px; }
.sizes { display: flex; align-items: end; gap: 28px; }
.sizes div { display: grid; gap: 8px; justify-items: center; }
.voice td:first-child { width: 50%; }

/* ---------- color ---------- */
.theme-pair > * { min-width: 0; }
[data-gc] { color: var(--text); }
.theme-pair { display: grid; grid-template-columns: 1fr 1fr; box-shadow: inset 0 0 0 1px var(--line); }
.theme-pane { position: relative; grid-template-columns: minmax(0, 1fr); padding: 24px; box-shadow: inset 0 0 0 1px var(--line); min-height: 340px; display: grid; grid-template-rows: auto 1fr auto; gap: 16px; background: var(--bg-page); color: var(--text); overflow: hidden; }
.theme-pane .sig { width: 100%; aspect-ratio: 3 / 1.15; background: var(--accent); display: grid; align-content: end; padding: 14px 16px; color: var(--on-accent); }
.theme-pane .sig .big { font-size: 36px; line-height: 40px; font-weight: 300; letter-spacing: -0.02em; }
[data-cp] { position: relative; cursor: copy; }
.cp-hint { position: absolute; right: 8px; top: 8px; padding: 2px 6px; font: 11px/14px var(--font-mono); background: var(--bg-surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); opacity: 0; transform: translateY(-2px); transition: opacity 160ms var(--ease), transform 160ms var(--ease); pointer-events: none; z-index: 2; }
[data-cp]:hover .cp-hint, [data-cp]:focus-visible .cp-hint { opacity: 1; transform: none; }
.ramp > div[data-cp] i { position: relative; transition: transform 160ms var(--ease); }
.ramp > div[data-cp]:hover i { transform: translateY(-2px); }
.ramp .cp-hint { top: auto; bottom: 6px; right: 6px; left: 6px; text-align: center; }
.scale > div[data-cp]:hover { background: color-mix(in srgb, var(--bg-raised) 50%, transparent); }
.scale .cp-hint { top: 50%; right: 220px; transform: translateY(-50%); }
.scale > div[data-cp]:hover .cp-hint { transform: translateY(-50%); }
.ramp { display: grid; grid-template-columns: repeat(7, 1fr); }
.ramp > div { display: grid; grid-template-rows: 72px auto; }
.ramp i { display: block; box-shadow: inset 0 0 0 1px var(--line); }
.ramp span { padding: 8px 2px 0; font: 10px/14px var(--font-mono); color: var(--muted); }
.ramp b { display: block; font-weight: 400; color: var(--text); }
.share { display: flex; height: 36px; box-shadow: inset 0 0 0 1px var(--line); }
.share i { display: block; height: 100%; }
.share-key { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px; }
.share-key span { display: flex; align-items: center; gap: 6px; }
.share-key i { width: 10px; height: 10px; display: block; box-shadow: inset 0 0 0 1px var(--line); }
.pass { display: inline-flex; padding: 0 6px; font: 10px/16px var(--font-mono); letter-spacing: 0.05em; box-shadow: inset 0 0 0 1px var(--line); }
.pass.ok { color: var(--text); }
.pass.lg { color: var(--muted); }
.pass.no { color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cols { display: flex; align-items: end; gap: 6px; height: 140px; padding: 0 4px; border-bottom: 1px solid var(--line); position: relative; }
.cols div { flex: 1; position: relative; height: 100%; }
.cols .n { position: absolute; bottom: 0; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--line) 0 2px, transparent 2px 5px); }
.cols .a { position: absolute; bottom: 0; left: 22%; right: 22%; background: var(--muted); }
.cols .a.hot { background: var(--accent); }
.cols .lim { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--muted); }
.crop { width: 100%; height: 190px; background-repeat: no-repeat; background-size: 230%; box-shadow: inset 0 0 0 1px var(--line); }

/* ---------- type ---------- */
.specimen { display: grid; grid-template-columns: 1fr 1fr; box-shadow: inset 0 0 0 1px var(--line); }
.specimen > div { padding: 24px; display: grid; grid-template-rows: auto 96px auto auto; align-content: start; gap: 14px; position: relative; overflow: hidden; }
.specimen > div + div { box-shadow: inset 1px 0 0 var(--line); }
html[lang="zh-CN"] .lang-en, html:not([lang="zh-CN"]) .lang-zh { display: none !important; }
html[lang="zh-CN"] .specimen { grid-template-columns: 1fr; }
.specimen > .cjk { grid-column: 1 / -1; grid-template-rows: auto auto auto auto; box-shadow: inset 0 1px 0 var(--line); }
.specimen > .cjk .aa { font-weight: 400; }
.specimen .aa { align-self: center; white-space: nowrap; font-size: 48px; line-height: 56px; font-weight: 300; letter-spacing: -0.03em; }
.specimen .aa.mono { font-family: var(--font-mono); font-size: 44px; line-height: 56px; letter-spacing: -0.02em; }
.specimen .weights.mono { font-family: var(--font-mono); }
.specimen .glyphs { font-size: 16px; line-height: 26px; color: var(--muted); }
.specimen .glyphs.mono { font-family: var(--font-mono); font-size: 14px; line-height: 22px; }
.weights { display: flex; gap: 22px; font-size: 22px; }
.scale { box-shadow: inset 0 0 0 1px var(--line); }
.scale > div { display: grid; grid-template-columns: 1fr 190px; gap: 16px; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.scale > div:last-child { border-bottom: 0; }
.scale .spec-t { display: grid; gap: 2px; text-align: right; }
.pairing { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); box-shadow: 0 0 0 1px var(--line); }
.pairing > div { background: var(--bg-page); padding: 18px 20px; display: grid; gap: 4px; }
.t-num .t-small { margin-left: 4px; }
.leader { display: flex; align-items: baseline; gap: 8px; font-size: 14px; }
.leader i { flex: 1; border-bottom: 1px dotted var(--muted); transform: translateY(-4px); opacity: 0.6; }

/* ---------- motion / materials ---------- */
.motion-track { position: relative; height: 26px; background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--line); }
.motion-track i { position: absolute; left: 4px; top: 4px; width: 18px; height: 18px; background: var(--text); display: block; transition: transform 520ms var(--ease); }
.motion-track.sp i { background: var(--accent); transition-timing-function: var(--spring); }
.motion-go .motion-track i { transform: translateX(calc(var(--w, 200px) - 26px)); }
.scanbox { position: relative; width: 18px; height: 18px; display: grid; place-items: center; background: var(--badge-bg); color: var(--on-accent); font: 11px/1 var(--font-mono); }
.scanbox::after { content: ""; position: absolute; inset: -6px; border: 1px solid var(--accent); animation: scan 900ms var(--ease) infinite; }
@keyframes scan { from { transform: scale(0.6); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }

.mat3 { height: 340px; }

.mat { position: relative; height: 240px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }

/* ---------- illustration ---------- */

.qrows { display: grid; border-top: 1px solid var(--line); }

.num { width: 18px; height: 18px; display: inline-grid; place-items: center; background: var(--badge-bg); color: var(--on-accent); font: 11px/1 var(--font-mono); vertical-align: -3px; margin-right: 6px; }

/* ---------- AI playground + components (from v1) ---------- */
.rules { display: grid; border-top: 1px solid var(--line); }
.rule { display: grid; grid-template-columns: 56px 1fr 1.3fr; gap: 24px; padding: 18px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.play { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }

.controls { display: grid; gap: 24px; padding: 24px; background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--line); }

input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; margin: 4px 0 0; background: transparent; display: block; }

.bands { display: grid; grid-template-columns: 38.5% 38.4% 1fr; margin-top: -17px; }

.bands span.on { color: var(--text); border-top-color: var(--text); }
#fired { margin: 0; padding: 0; display: grid; gap: 8px; }
#fired li { list-style: none; display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 13px; line-height: 19px; color: var(--muted); transition: color 240ms; }
#fired li .n { font-family: var(--font-mono); font-size: 11px; }
#fired li.on { color: var(--text); }
#fired li.on .n { color: var(--accent); }
.panel { position: relative; min-height: 0; display: flex; flex-direction: column; background: var(--bg-page); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.panel-head { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--line); }

.thread { flex: 1; padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.rise { animation: rise 420ms var(--ease) both; }

.state { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }

.card { padding: 18px 20px; display: grid; gap: 10px; }
.card .t-headline { font-size: 18px; line-height: 25px; margin-top: 2px; }
.card-foot { margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--line); }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-head { align-items: baseline; }

.card-foot { display: flex; justify-content: flex-start; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

@keyframes spin { to { transform: rotate(360deg); } }

.acrow { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 8px 12px; width: 100%; max-width: 340px; padding: 12px 14px; box-shadow: inset 0 0 0 1px var(--line); }

.acrow { grid-template-columns: minmax(0, 1fr) auto; }
.acrow .lab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acrow .st { white-space: nowrap; }

/* component page */
.comp-stage { display: grid; grid-template-columns: 1fr 1fr; box-shadow: inset 0 0 0 1px var(--line); }

.comp-stage .tn { position: absolute; left: 12px; top: 10px; font: 10px/14px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

/* ---------- responsive lab ---------- */

.ra-tabs { display: none; }
.ra-stage { position: relative; min-width: 0; overflow: hidden; }
.ra-stage .head { position: absolute; left: 28px; top: 22px; z-index: 2; }

@container (max-width: 1099px) {
  .ra { grid-template-columns: 56px 1fr; }
  .ra-panel { position: absolute; left: 56px; right: 0; bottom: 0; height: 46%; border-left: 0; border-top: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: 0 -16px 40px rgba(0, 0, 0, 0.25); }

}

  .ra-stage { display: block; }

  .ra-art { position: relative; inset: auto; height: 150px; margin: 8px 16px 0; box-shadow: inset 0 0 0 1px var(--line); }
  .ra-panel { position: static; height: auto; left: auto; border-top: 1px solid var(--line); box-shadow: none; background: var(--bg-page); overflow: auto; }
  .ra-panel .grab { display: none; }
  .ra-tabs { display: flex; justify-content: space-around; height: 52px; align-items: center; border-top: 1px solid var(--line); }
  .ra-tabs i { width: 18px; height: 18px; display: block; box-shadow: inset 0 0 0 1.4px var(--muted); }

}
.bp-table td:first-child { white-space: nowrap; }

/* ---------- agents / files ---------- */
.files { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; align-items: start; }
.filelist { display: grid; gap: 6px; }

.score { box-shadow: inset 0 0 0 1px var(--line); }

.mark { width: 8px; height: 8px; display: block; align-self: center; box-shadow: inset 0 0 0 1.5px var(--muted); }

.steps { counter-reset: s; display: grid; gap: 0; border-top: 1px solid var(--line); }

.steps > div::before { content: counter(s, decimal-leading-zero); font: 11px/22px var(--font-mono); color: var(--accent); }


/* ---------- states (interaction + system) ---------- */

.gc-causes > div > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.gc-causes > div > .t-label { white-space: nowrap; flex: none; }
.ph { position: relative; }
.ph + h2 { margin-top: 12px; }

.ai-tabs { display: inline-flex; margin: 0 0 24px; }

.ai-tabs a:not(.on):hover { color: var(--text); }
.ready-sum { display: flex; align-items: baseline; gap: 14px; margin: 4px 0 16px; }
.desk-card { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--line); text-decoration: none; color: inherit; transition: box-shadow 160ms; }

.desk-thumbs { overflow: hidden; }
.desk-body { display: grid; gap: 10px; align-content: center; justify-items: start; padding: 24px; }
.desk-body .cta { margin-top: 6px; }

.ev2 figure { margin: 0; display: grid; gap: 6px; } .ev2 img { width: 100%; box-shadow: inset 0 0 0 1px var(--line); cursor: zoom-in; }
.evnums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); box-shadow: 0 0 0 1px var(--line); margin-top: 20px; }

.tile > .t-label:first-child { text-transform: none; letter-spacing: 0; font: 500 13px/18px var(--font-sans); color: var(--text); }
details.more { margin-top: 28px; }

details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+"; width: 14px; text-align: center; }

.say { display: grid; box-shadow: inset 0 0 0 1px var(--line); }

.say a + a { box-shadow: inset 0 1px 0 var(--line); }
.say a:hover { background: var(--bg-raised); }

.say .tgt { display: grid; gap: 2px; }
@media (max-width: 720px) { .say a { grid-template-columns: 1fr; gap: 4px; } .say .arr { display: none; } }
.sk-h::before { content: attr(data-n); font: 13px/1 var(--font-mono); color: var(--accent); margin-right: 14px; vertical-align: 0.3em; }
.sk-list { display: grid; box-shadow: inset 0 0 0 1px var(--line); }
.sk + .sk { box-shadow: inset 0 1px 0 var(--line); }
.sk summary { list-style: none; display: grid; grid-template-columns: 170px minmax(0, 1fr) auto 16px; gap: 16px; align-items: center; padding: 16px 18px; cursor: pointer; transition: background 160ms; }
.sk summary::-webkit-details-marker { display: none; }
.sk summary::after { content: "+"; font: 14px var(--font-mono); color: var(--muted); transition: transform 260ms var(--ease); }
.sk[open] summary::after { transform: rotate(45deg); }
.sk summary:hover { background: var(--bg-raised); }
.sk-id { color: var(--accent); }
.sk-t { display: grid; gap: 3px; }
.sk-kind { font: 11px/1 var(--font-mono); letter-spacing: 0.04em; padding: 5px 7px; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); white-space: nowrap; }
.sk-kind.j { color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.sk-body { display: grid; gap: 8px; padding: 4px 18px 18px 204px; }
.sk-say { margin: 0 0 8px; font-size: 16px; }
@media (max-width: 720px) { .sk summary { grid-template-columns: 1fr auto; } .sk-id { grid-column: 1 / -1; } .sk summary::after { display: none; } .sk-body { padding-left: 18px; } }
.ht-card > *, .ht-take, .ht-take > * { min-width: 0; }
.sk-h3 { margin: 32px 0 6px; font-size: 18px; font-weight: 500; }
.sk-h3 + .sub { margin-bottom: 14px; }
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); box-shadow: 0 0 0 1px var(--line); margin: 6px 0 16px; }
.ba > div { display: grid; gap: 10px; align-content: start; padding: 14px; background: var(--bg-surface); }
.ba-stage { display: grid; place-items: center; min-height: 150px; padding: 18px; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 12px 12px; overflow: hidden; }
.ba-row { display: flex; gap: 10px; }
.ba-grid { display: grid; grid-template-columns: repeat(3, auto); gap: 12px 14px; }
.ba-grid > span { display: grid; gap: 4px; justify-items: center; }
.ba-card { width: 100%; max-width: 280px; }
.ba-over { white-space: nowrap; overflow: visible; }
.ba-trunc { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ba-narrow { max-width: 220px !important; }
.ba-wrap { max-width: 170px !important; grid-template-columns: minmax(0, 1fr) minmax(0, auto) !important; } .ba-wrap .lab, .ba-wrap .st { white-space: normal !important; }
.ba-quote { margin: 0; max-width: 34ch; font-size: 15px; line-height: 1.5; }
.ba-pre { margin: 0; font: 12px/1.6 var(--font-mono); white-space: pre; }
.ba-img { width: 100%; max-height: 220px; object-fit: contain; }
.ba-rule { display: grid; gap: 4px; max-width: 36ch; }
.seg.no-slide button { transition: none !important; }
.sk-src { margin-top: 4px; }
@media (max-width: 720px) { .ba { grid-template-columns: 1fr; } }
.sk-main { box-shadow: inset 0 0 0 1px var(--line); }
.sk-main-hd { display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sk-main-hd .pbtn { margin-left: auto; }
.sk-main .sk-list { box-shadow: none; }
.sk-stepn { display: inline-grid; place-items: center; width: 22px; height: 22px; font: 12px/1 var(--font-mono); background: var(--text); color: var(--bg-page); }
.sk-step summary { grid-template-columns: 40px minmax(0, 1fr) auto 16px; }
.sk-step .sk-body { padding-left: 74px; }
.ht-loop { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-top: 28px; padding: 16px 18px; box-shadow: inset 0 0 0 1px var(--line); color: inherit; text-decoration: none; transition: background 160ms; }
.ht-loop:hover { background: var(--bg-raised); }
.csteps { display: grid; gap: 20px; }
.cstep { display: grid; gap: 10px; min-width: 0; }
.step-hd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.step-hd .no { width: 18px; height: 18px; display: inline-grid; place-items: center; font: 11px/1 var(--font-mono); background: var(--text); color: var(--bg-page); align-self: center; }
.more-why { margin: 8px 0 10px; }
details.more + details.more { margin-top: 12px; }
details.more > .codebox { margin-top: 8px; }
.stcode { min-width: 0; }
.stcode summary { position: absolute; top: 7px; right: 8px; margin-left: 0 !important; }
.stcode:not([open]) .stcode-body { display: none; }
.stcell, .stcell-cap { min-width: 0; }
.stcode summary { list-style: none; display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px; margin-left: -8px; cursor: pointer; font-size: 12px; color: var(--muted); transition: color 160ms, background 160ms; }
.stcode summary::-webkit-details-marker { display: none; }
.stcode summary::before { content: "</>"; font: 11px var(--font-mono); }
.stcode summary:hover { color: var(--text); background: color-mix(in srgb, var(--bg-raised) 60%, transparent); }
.stcode[open] summary { color: var(--text); }
.stcode-body { position: relative; max-width: 100%; overflow: hidden; margin-top: 6px; background: var(--bg-surface); box-shadow: inset 0 0 0 1px var(--line); }
.stcode-head { display: flex; align-items: center; justify-content: space-between; height: 34px; padding: 0 4px 0 12px; border-bottom: 1px solid var(--line); }
.stcode-body pre { margin: 0; padding: 12px; max-height: 240px; overflow: auto; overflow-x: auto; font: 12px/18px var(--font-mono); color: var(--text); white-space: pre; }
.stcode-head .pbtn { height: 26px; padding: 0 8px; font-size: 12px; }
.stcell-cap { position: relative; display: grid; gap: 2px; align-content: start; min-height: 40px; padding: 11px 90px 11px 14px; box-shadow: inset 0 1px 0 var(--line); }
.stcell-cap:has(.stcode[open]) { padding-right: 14px; }
.cta, .pbtn { transition: transform 140ms var(--ease), filter 200ms, background 200ms, opacity 200ms; }
.pbtn { gap: 8px; cursor: pointer; }
.pbtn:hover, .pbtn.is-hover { background: var(--bg-raised); }
.cta:hover, .cta.is-hover, .pbtn.primary:hover, .pbtn.primary.is-hover { background: color-mix(in srgb, var(--cta-bg) 80%, var(--bg-page)); filter: none; }
.cta:active, .cta.is-active, .pbtn.primary:active, .pbtn.primary.is-active { background: color-mix(in srgb, var(--cta-bg) 66%, var(--bg-page)); }
.pbtn.is-active:not(.primary) { background: var(--bg-chip); }
.cta.is-focus, .pbtn.is-focus, .seg button.is-focus, .link.is-focus { outline: 1.5px solid var(--text); outline-offset: 2px; }
.cta:active, .pbtn:active, .is-active { transform: scale(0.96); }
.cta:disabled, .pbtn:disabled { opacity: 0.42; cursor: not-allowed; filter: none; transform: none; }
.pbtn.is-loading:disabled { opacity: 1; cursor: progress; }
.pbtn .ring, .ask-send .ring, .toast .ring { width: 11px; height: 11px; border-color: color-mix(in srgb, currentColor 30%, transparent); border-top-color: currentColor; }
.seg button.is-hover { color: var(--text); }
.seg button:disabled { opacity: 0.4; cursor: not-allowed; }
.askbox { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 340px; height: 44px; padding: 0 5px 0 14px; box-shadow: inset 0 0 0 1px var(--line); background: var(--bg-page); transition: box-shadow 200ms; }
.askbox:hover, .askbox.is-hover { box-shadow: inset 0 0 0 1px var(--muted); }
.askbox:focus-within, .askbox.is-focus { box-shadow: inset 0 0 0 1.5px var(--text); }
.askbox.is-error { box-shadow: inset 0 0 0 1.5px var(--accent); }
.askbox.is-sending { opacity: 0.7; }
.ask-in { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--text); font: 14px/20px var(--font-sans); }
.ask-in::placeholder { color: var(--muted); }
.ask-in:focus-visible { outline: 0; }
.ask-send { width: 34px; height: 34px; display: grid; place-items: center; background: var(--cta-bg); color: var(--cta-fg); }
.ask-send svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.ask-send:disabled { background: var(--bg-raised); color: var(--muted); cursor: not-allowed; }
.state.watch { color: var(--muted); }
.state.opportunity { color: var(--text); }
.state.opportunity .sg { stroke: var(--accent); }
.sg.sg-fill { fill: currentColor; stroke: none; }
.state.busy { color: var(--text); }
.state.busy i { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.2; } }
.state.resolved { color: var(--muted); }
.state .sg { width: 10px; height: 10px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: square; stroke-linejoin: miter; }
.state.up { color: var(--accent); }
.state.down { color: var(--accent); }
.card-head .state > .sg { align-self: center; }
.link[role=link] { cursor: pointer; }
.link[role=link]:focus-visible { outline: 1.5px solid var(--text); outline-offset: 2px; }
a.link { cursor: pointer; transition: text-decoration-thickness 160ms, background 160ms; }
.link:hover, .link.is-hover { text-decoration-thickness: 2px; background: color-mix(in srgb, var(--link) 8%, transparent); }
.link.is-missing { color: var(--muted); text-decoration: line-through; cursor: default; }
.link.is-missing .g { background: none; box-shadow: inset 0 0 0 1px var(--muted); }
.peek { display: grid; gap: 4px; margin-top: 10px; padding: 10px 12px; min-width: 180px; justify-items: start; }
.echip { transition: box-shadow 200ms, background 200ms; cursor: default; }
.echip:hover, .echip.is-hover { box-shadow: 0 0 0 1.5px var(--accent); }
.echip.is-selected { background: var(--sel-bg); color: var(--sel-fg); box-shadow: inset 0 0 0 1px var(--text); }
.echip.is-checking { color: var(--muted); }
.echip.is-checking .ring { width: 12px; height: 12px; margin: 0 2px; }
.echip.is-stale { opacity: 0.6; }
.ev.is-linked { box-shadow: inset 0 1px 0 var(--edge-hi), 0 0 0 1.5px var(--accent); }
.ev.is-stale { opacity: 0.55; }
.conf.is-updating .conf-bar i { animation: shimmer 1.2s var(--ease) infinite; }
.conf.is-updating .conf-bar i:nth-child(2n) { animation-delay: 120ms; }
@keyframes shimmer { 50% { opacity: 0.35; } }
.toast { position: relative; overflow: hidden; }
.toast .timer { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--text); display: block; }
.toast.is-running .timer { width: 62%; }
.toast.is-paused .timer { width: 62%; background: var(--muted); }
.toast.is-done svg { stroke: var(--muted); }
.acrow.is-planned .bar, .acrow.is-undone .bar { display: none; }
.acrow.is-done .bar i, .acrow.is-failed .bar i { background: var(--muted); }
.acrow.is-undone .lab { text-decoration: line-through; color: var(--muted); }
.acrow.is-failed .st { color: var(--accent); }
.owner { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; width: 100%; max-width: 360px; }
.owner .pbtn, .owner > span:last-child { margin-left: auto; }
.pl-item.done .pl-body { color: var(--muted); }
.pl-item.is-failed .when { color: var(--accent); }
.alert { position: relative; width: 100%; max-width: 340px; transition: background 200ms; }
.alert.is-new { box-shadow: inset 2px 0 0 var(--accent), inset 0 1px 0 var(--edge-hi); }

.alert.is-resolved { opacity: 0.7; }
.spark.is-thinking circle.o { animation: pulse 900ms var(--ease) infinite; transform-origin: 7px 7px; }
@keyframes pulse { 50% { transform: scale(1.6); opacity: 0.6; } }
.gc-check { padding: 16px; display: grid; gap: 10px; width: 100%; max-width: 360px; }
.gc-causes { display: grid; }
.gc-causes > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.gc-causes .t-label { white-space: nowrap; flex: none; }
.gc-sugg { display: grid; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
.gc-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.gc-causes .t-label { color: var(--muted); }
.gc-causes .t-label.accent { color: var(--accent); }


/* states playground: flow + named parts */
.flow { display: grid; grid-template-columns: repeat(6, 1fr); margin: 8px 0 20px; box-shadow: inset 0 0 0 1px var(--line); }
.flow button { position: relative; display: grid; gap: 4px; align-content: start; padding: 14px 14px 16px; text-align: left; transition: background 200ms; }
.flow button + button { box-shadow: inset 1px 0 0 var(--line); }
.flow button::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: transparent; }
.flow button.past::after { background: var(--muted); }
.flow button[aria-pressed="true"] { background: var(--bg-surface); }
.flow button[aria-pressed="true"]::after { background: var(--accent); }
.flow button:hover { background: color-mix(in srgb, var(--bg-surface) 55%, transparent); }
.flow button:focus-visible { outline-offset: -2px; }
.flow .fn { font: 11px/14px var(--font-mono); color: var(--muted); }
.flow button[aria-pressed="true"] .fn { color: var(--accent); }
.flow .fname { font-size: 15px; font-weight: 500; }
.flow .fnote { font-size: 12px; line-height: 17px; }
.part { position: relative; padding: 18px 10px 10px; margin: 0 -10px; transition: box-shadow 240ms, background 240ms; }
.part .ptag { position: absolute; left: 10px; top: 2px; font: 10px/14px var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.part.hl { box-shadow: inset 0 0 0 1px var(--text); background: color-mix(in srgb, var(--bg-raised) 45%, transparent); }
.part.hl .ptag { color: var(--text); }
.part.is-new { box-shadow: inset 2px 0 0 var(--accent); }
.part.is-new .ptag { color: var(--accent); }
.part.is-new.hl { box-shadow: inset 2px 0 0 var(--accent), inset 0 0 0 1px var(--text); }
.thread { gap: 6px; }
.onscreen { margin: 0; padding: 0; display: grid; gap: 4px; }
.onscreen li { list-style: none; display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 4px 6px; margin: 0 -6px; font-size: 13px; line-height: 19px; transition: background 160ms; }
.onscreen li .n { font: 11px var(--font-mono); color: var(--muted); }
.onscreen li a { color: var(--text); text-decoration: none; }
.onscreen li a:hover { text-decoration: underline; }
.onscreen li.hl, .onscreen li:hover { background: color-mix(in srgb, var(--bg-raised) 70%, transparent); }
.newtag { font: 10px/14px var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); }
#fired li { cursor: default; padding: 2px 6px; margin: 0 -6px; }
#fired li:hover { background: color-mix(in srgb, var(--bg-raised) 70%, transparent); }


/* overview */
.ostats { display: grid; grid-template-columns: repeat(5, 1fr); box-shadow: inset 0 0 0 1px var(--line); margin-top: 16px; }
.ostats > div { display: grid; gap: 2px; padding: 16px 18px; }
.ostats > div + div { box-shadow: inset 1px 0 0 var(--line); }
.ostart { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); box-shadow: 0 0 0 1px var(--line); }
.ostart .ftile { padding: 16px; }
.ftiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); box-shadow: 0 0 0 1px var(--line); }
.ftile { display: grid; align-content: start; gap: 4px; padding: 0 0 16px; background: var(--bg-page); color: var(--text); text-decoration: none; transition: background 200ms; }
.ftile:hover { background: var(--bg-surface); }
.ftile > .t-strong, .ftile > .t-small { padding: 0 16px; }
.fprev { position: relative; height: 150px; display: grid; place-items: center; overflow: hidden; margin-bottom: 12px; box-shadow: inset 0 -1px 0 var(--line); }
.fcolor { grid-template-rows: 1fr 1fr; place-items: stretch; }
.fcolor > div { display: flex; }
.fcolor i { flex: 1; display: block; }
.fcolor i.sig { flex: 0.5; }
.ftype { display: grid; align-content: center; justify-items: start; gap: 6px; padding: 0 22px; }
.ftype .aa { font-size: 26px; line-height: 32px; font-weight: 400; letter-spacing: -0.02em; }
.ftype .mo { font: 22px/28px var(--font-mono); color: var(--muted); }
.cband { display: flex; height: 64px; box-shadow: inset 0 0 0 1px var(--line); }
.cband > div { display: grid; align-content: center; gap: 2px; padding: 0 14px; }
.cband > div + div { box-shadow: inset 1px 0 0 var(--line); }
.cband > div:first-child { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.cband > div:first-child .t-label { color: var(--accent); }
.cband > div:last-child { background: var(--bg-surface); }
.cband-axis { position: relative; height: 18px; margin-top: 6px; }
.cband-axis span { position: absolute; transform: translateX(-50%); }
.cband-axis span:first-child { transform: none; }
.cband-axis span:last-child { transform: translateX(-100%); }
.rules.compact .rule { padding: 12px 0; }
.cgroup { margin-top: 18px; display: grid; gap: 10px; }
.cgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); box-shadow: 0 0 0 1px var(--line); }
.ctile { display: grid; grid-template-rows: 1fr auto; background: var(--bg-page); color: var(--text); text-decoration: none; transition: background 200ms; }
.ctile:hover { background: var(--bg-surface); }
.cgroup:last-child .cprev { height: 240px; }
.cgroup:last-child .cprev > .inner { transform: scale(0.74); }
.cprev { height: 170px; display: grid; place-items: center; padding: 20px; overflow: hidden; pointer-events: none; background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 14px 14px; }
.cprev > .inner { width: 100%; max-width: 300px; transform: scale(0.82); transform-origin: center; display: grid; justify-items: center; }
.ccap { display: flex; justify-content: space-between; gap: 8px; padding: 12px 14px; box-shadow: inset 0 1px 0 var(--line); }
.ofiles { display: flex; flex-wrap: wrap; gap: 8px; }
.ofiles span { padding: 5px 10px; box-shadow: inset 0 0 0 1px var(--line); }

/* ---------- changelog ---------- */
.cl { display: grid; border-top: 1px solid var(--line); }
.cl-row { display: grid; grid-template-columns: 120px 1fr; gap: 24px; padding: 28px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 80px; }
.cl-v .t-num { color: var(--muted); }
.cl-row:first-child .cl-v .t-num { color: var(--accent); }
